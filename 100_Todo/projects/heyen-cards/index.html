<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>禾言圖卡・受眾設定越細越準？剛好相反</title>
<link rel="stylesheet" href="fonts/bold/GenJyuuGothic-Bold.css">
<link rel="stylesheet" href="fonts/medium/GenJyuuGothic-Medium.css">
<style>
:root{
  --y:#FCD501; --y2:#FFCA26; --y3:#FFEDC5; --g:#AED056;
  --cream:#FFF9F6; --mint:#C9E6E4; --ink:#000; --red:#C7302F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#555;font-family:'GenJyuu Gothic','GenJyuuGothic','源柔ゴシック',"PingFang TC","Heiti TC","Noto Sans TC",sans-serif}

.card{
  width:1080px;height:1350px;position:relative;overflow:hidden;
  background:#F0F0EE;
  background-image:
    linear-gradient(rgba(0,0,0,.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.09) 1px, transparent 1px);
  background-size:34px 34px;
  margin:0 auto;
}
.paper{
  position:absolute;left:66px;top:170px;right:66px;bottom:132px;
  background:var(--cream);border:none;border-radius:38px;
  box-shadow:14px 14px 0 var(--y2), 14px 14px 0 4px var(--ink);
  padding:62px 58px;display:flex;flex-direction:column;
}
.paper.yellow{background:var(--y)}

.corner{position:absolute;width:230px;height:230px;z-index:0}
.corner.tl{left:-92px;top:-98px}
.corner.br{right:-92px;bottom:-98px;transform:rotate(180deg)}
.corner svg{width:100%;height:100%;display:block}
.hylogo{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:290px;z-index:6}
.hylogo img{width:100%;display:block}
.flag{position:absolute;left:-14px;top:-24px;z-index:5;background:#AED056;
  padding:14px 40px 14px 26px;font-size:31px;font-weight:900;
  clip-path:polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%)}
.bpill{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
  background:#C9E6E4;border-radius:20px;padding:14px 34px;
  font-size:30px;font-weight:900;white-space:nowrap;z-index:4}

h1{position:relative;z-index:2;font-size:96px;line-height:1.3;font-weight:900;letter-spacing:-2px}
h1 .u{background:linear-gradient(transparent 60%, var(--y) 60%)}
h2{position:relative;z-index:2;font-size:66px;font-weight:900;line-height:1.32;letter-spacing:-1px;margin-top:30px}
h2 .hl{background:linear-gradient(transparent 7%, var(--y) 7%, var(--y) 93%, transparent 93%);
  color:var(--ink);padding:4px 16px;display:inline-block}
.paper.yellow h2 .hl{background:none;color:var(--red);padding:0}

/* 封面：類型小標／主標／一個視覺證據 */
.paper.cover{justify-content:center}
.paper.cover h1{margin-top:20px}

.viz{position:relative;z-index:2;display:block;flex:none}
.note{position:relative;z-index:2;flex:none;background:#fff;border-radius:22px;padding:32px 36px;font-size:36px;font-weight:800;line-height:1.6}
.note .s{font-weight:700;color:#333}

/* 三件事 */
.three{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;margin-top:20px}
.three .row{display:flex;align-items:center;gap:26px;background:#fff;border-radius:24px;padding:30px 30px;box-shadow:0 4px 0 rgba(0,0,0,.07)}
.three .row .no{flex:none;width:84px;height:84px}
.three .row .no svg{width:84px;height:84px;display:block}
.three .row .tx{flex:1}
.three .row .t{font-size:44px;font-weight:900;line-height:1.3}
.three .row .d{font-size:32px;font-weight:700;color:#333;margin-top:8px}
.three .row .ic{flex:none;width:140px;height:110px}
.three .row .ic svg{width:140px;height:110px;display:block}

/* 檢查清單 */
.ck{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;margin-top:24px}
.ck .row{display:flex;align-items:center;gap:20px;background:#fff;border-radius:20px;padding:28px 30px}
.ck .row svg{flex:none;width:46px;height:46px;display:block}
.ck .row span{font-size:35px;font-weight:800;line-height:1.35}
</style>
</head>
<body>

<!-- 1 封面 -->
<div class="card" id="p1" data-document-role="page" data-label="封面">
  <div class="corner tl"><svg viewBox="0 0 100 100"><path d="M50 0c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z" fill="#FCD501"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 100 100"><path d="M50 0c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z" fill="#FCD501"/></svg></div>
  <div class="hylogo"><img src="https://zhuer0323-tech.github.io/dora-workspace/heyen-cards/logo_use.png" alt="禾言數位行銷"></div>
  <div class="paper cover">
    <div class="flag">教學/新手</div>
    <h1>受眾設越細<br>成效反而<span class="u">越差</span></h1>
    <div class="viz" style="width:832px;height:380px;margin-top:64px"><svg width="832" height="380" viewBox="0 0 832 380" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="832" height="380" rx="26" fill="#fff"/>
      <!-- 勾選框 -->
      <g font-size="28" font-weight="900" fill="#000">
        <rect x="40" y="40" width="40" height="40" rx="8" fill="#FCD501" stroke="#000" stroke-width="4"/><path d="M48 60l9 9 16-18" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="70">興趣 A</text>
        <rect x="40" y="102" width="40" height="40" rx="8" fill="#FCD501" stroke="#000" stroke-width="4"/><path d="M48 122l9 9 16-18" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="132">興趣 B</text>
        <rect x="40" y="164" width="40" height="40" rx="8" fill="#FCD501" stroke="#000" stroke-width="4"/><path d="M48 184l9 9 16-18" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="194">興趣 C</text>
        <rect x="40" y="226" width="40" height="40" rx="8" fill="#FCD501" stroke="#000" stroke-width="4"/><path d="M48 246l9 9 16-18" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="256">興趣 D</text>
      </g>
      <text x="130" y="338" text-anchor="middle" font-size="30" font-weight="900" fill="#555">勾越多</text>
      <!-- 漏斗 -->
      <path d="M260 52H560L452 200V262H368V200z" fill="#FFEDC5" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
      <path d="M570 157h52" stroke="#000" stroke-width="6" stroke-linecap="round"/>
      <path d="M618 143l22 14-22 14z" fill="#000"/>
      <!-- 剩下的小池子 -->
      <circle cx="732" cy="157" r="64" fill="#fff" stroke="#C7302F" stroke-width="5" stroke-dasharray="12 9"/>
      <circle cx="716" cy="144" r="11" fill="#AED056" stroke="#000" stroke-width="3"/>
      <rect x="704" y="158" width="24" height="30" rx="10" fill="#AED056" stroke="#000" stroke-width="3"/>
      <circle cx="750" cy="144" r="11" fill="#FFCA26" stroke="#000" stroke-width="3"/>
      <rect x="738" y="158" width="24" height="30" rx="10" fill="#FFCA26" stroke="#000" stroke-width="3"/>
      <text x="732" y="338" text-anchor="middle" font-size="30" font-weight="900" fill="#C7302F">池子越小</text>
    </svg></div>
  </div>
</div>

<!-- 2 設太窄的三件事 -->
<div class="card" id="p2" data-document-role="page" data-label="設太窄的三件事">
  <div class="corner tl"><svg viewBox="0 0 100 100"><path d="M50 0c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z" fill="#FCD501"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 100 100"><path d="M50 0c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z" fill="#FCD501"/></svg></div>
  <div class="hylogo"><img src="https://zhuer0323-tech.github.io/dora-workspace/heyen-cards/logo_use.png" alt="禾言數位行銷"></div>
  <div class="paper">
    <div class="flag">設太窄會怎樣</div>
    <h2>受眾太窄的<span class="hl">三個後果</span></h2>
    <div class="three">
      <div class="row">
        <div class="no"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="#FCD501" stroke="#000" stroke-width="4"/><text x="42" y="57" text-anchor="middle" font-size="44" font-weight="900" fill="#000">1</text></svg></div>
        <div class="tx"><div class="t">能觸及的人太少</div><div class="d">系統只能投給同一批人</div></div>
        <div class="ic"><svg viewBox="0 0 140 110"><circle cx="70" cy="55" r="44" fill="#fff" stroke="#000" stroke-width="4" stroke-dasharray="10 8"/><circle cx="70" cy="44" r="10" fill="#AED056" stroke="#000" stroke-width="3"/><rect x="59" y="57" width="22" height="26" rx="9" fill="#AED056" stroke="#000" stroke-width="3"/></svg></div>
      </div>
      <div class="row">
        <div class="no"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="#FCD501" stroke="#000" stroke-width="4"/><text x="42" y="57" text-anchor="middle" font-size="44" font-weight="900" fill="#000">2</text></svg></div>
        <div class="tx"><div class="t">頻率飆高</div><div class="d">看到第七次，只會滑掉</div></div>
        <div class="ic"><svg viewBox="0 0 140 110"><path d="M4 55c14-26 42-34 64-26" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/><path d="M4 55c14 26 42 34 64 26" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/><circle cx="38" cy="55" r="13" fill="#000"/><text x="106" y="70" text-anchor="middle" font-size="40" font-weight="900" fill="#C7302F">×7</text></svg></div>
      </div>
      <div class="row">
        <div class="no"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="#FCD501" stroke="#000" stroke-width="4"/><text x="42" y="57" text-anchor="middle" font-size="44" font-weight="900" fill="#000">3</text></svg></div>
        <div class="tx"><div class="t">成本被推高</div><div class="d">池子小，競價自然貴</div></div>
        <div class="ic"><svg viewBox="0 0 140 110"><circle cx="46" cy="62" r="34" fill="#FFCA26" stroke="#000" stroke-width="4"/><text x="46" y="76" text-anchor="middle" font-size="38" font-weight="900" fill="#000">$</text><path d="M110 96V24" stroke="#C7302F" stroke-width="8" stroke-linecap="round"/><path d="M92 40l18-24 18 24z" fill="#C7302F"/></svg></div>
      </div>
    </div>
  </div>
</div>

<!-- 3 讓素材去篩人 -->
<div class="card" id="p3" data-document-role="page" data-label="讓素材去篩人">
  <div class="corner tl"><svg viewBox="0 0 100 100"><path d="M50 0c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z" fill="#FCD501"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 100 100"><path d="M50 0c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z" fill="#FCD501"/></svg></div>
  <div class="hylogo"><img src="https://zhuer0323-tech.github.io/dora-workspace/heyen-cards/logo_use.png" alt="禾言數位行銷"></div>
  <div class="paper yellow">
    <div class="flag">那要怎麼設</div>
    <h2>讓<span class="hl">素材</span>去篩人</h2>
    <div class="viz" style="width:832px;height:360px;margin-top:30px"><svg width="832" height="360" viewBox="0 0 832 360" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="406" height="360" rx="24" fill="#fff"/>
      <rect x="426" y="0" width="406" height="360" rx="24" fill="#fff"/>
      <!-- 左：設定去篩 -->
      <text x="203" y="58" text-anchor="middle" font-size="32" font-weight="900" fill="#C7302F">✕ 用設定篩</text>
      <path d="M103 74H303" stroke="#C7302F" stroke-width="5" stroke-linecap="round"/>
      <path d="M60 112H346L246 216V270H160V216z" fill="#FFEDC5" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
      <text x="203" y="160" text-anchor="middle" font-size="26" font-weight="900" fill="#000">興趣層層勾</text>
      <text x="203" y="326" text-anchor="middle" font-size="28" font-weight="900" fill="#000">剩沒幾人可投</text>
      <!-- 右：素材去篩 -->
      <text x="629" y="58" text-anchor="middle" font-size="32" font-weight="900" fill="#3E7A1F">✓ 用素材篩</text>
      <path d="M529 74H729" stroke="#3E7A1F" stroke-width="5" stroke-linecap="round"/>
      <g stroke="#000" stroke-width="3">
        <circle cx="486" cy="128" r="11" fill="#D6D3CF"/><circle cx="526" cy="128" r="11" fill="#D6D3CF"/><circle cx="566" cy="128" r="11" fill="#AED056"/><circle cx="606" cy="128" r="11" fill="#D6D3CF"/><circle cx="646" cy="128" r="11" fill="#D6D3CF"/><circle cx="686" cy="128" r="11" fill="#AED056"/><circle cx="726" cy="128" r="11" fill="#D6D3CF"/><circle cx="766" cy="128" r="11" fill="#D6D3CF"/>
        <circle cx="506" cy="166" r="11" fill="#D6D3CF"/><circle cx="546" cy="166" r="11" fill="#D6D3CF"/><circle cx="586" cy="166" r="11" fill="#D6D3CF"/><circle cx="626" cy="166" r="11" fill="#AED056"/><circle cx="666" cy="166" r="11" fill="#D6D3CF"/><circle cx="706" cy="166" r="11" fill="#D6D3CF"/><circle cx="746" cy="166" r="11" fill="#AED056"/>
      </g>
      <text x="629" y="216" text-anchor="middle" font-size="24" font-weight="800" fill="#555">受眾開寬</text>
      <rect x="470" y="236" width="318" height="56" rx="14" fill="#FCD501" stroke="#000" stroke-width="4"/>
      <text x="629" y="274" text-anchor="middle" font-size="26" font-weight="900" fill="#000">文案講清楚找誰</text>
      <text x="629" y="334" text-anchor="middle" font-size="28" font-weight="900" fill="#000">對的人自己停下</text>
    </svg></div>
    <div class="ck">
      <div class="row"><svg viewBox="0 0 46 46"><rect x="3" y="3" width="40" height="40" rx="9" fill="#fff" stroke="#000" stroke-width="4"/><path d="M12 23l8 8 14-16" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>受眾給寬一點</span></div>
      <div class="row"><svg viewBox="0 0 46 46"><rect x="3" y="3" width="40" height="40" rx="9" fill="#fff" stroke="#000" stroke-width="4"/><path d="M12 23l8 8 14-16" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>把訊息寫清楚</span></div>
      <div class="row"><svg viewBox="0 0 46 46"><rect x="3" y="3" width="40" height="40" rx="9" fill="#fff" stroke="#000" stroke-width="4"/><path d="M12 23l8 8 14-16" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>想找誰，文案第一行就講</span></div>
    </div>
  </div>
</div>

<!-- 4 舉個例 -->
<div class="card" id="p4" data-document-role="page" data-label="舉個例">
  <div class="corner tl"><svg viewBox="0 0 100 100"><path d="M50 0c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z" fill="#FCD501"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 100 100"><path d="M50 0c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z" fill="#FCD501"/></svg></div>
  <div class="hylogo"><img src="https://zhuer0323-tech.github.io/dora-workspace/heyen-cards/logo_use.png" alt="禾言數位行銷"></div>
  <div class="paper">
    <div class="flag">舉個例</div>
    <h2>第一行就點名<span class="hl">要找誰</span></h2>
    <div class="viz" style="width:832px;height:300px;margin-top:34px"><svg width="832" height="300" viewBox="0 0 832 300" xmlns="http://www.w3.org/2000/svg">
      <!-- 貼文 -->
      <rect x="4" y="4" width="824" height="292" rx="26" fill="#fff" stroke="#000" stroke-width="5"/>
      <circle cx="64" cy="64" r="28" fill="#FCD501" stroke="#000" stroke-width="4"/>
      <rect x="108" y="46" width="180" height="16" rx="8" fill="#000"/>
      <rect x="108" y="72" width="110" height="12" rx="6" fill="#CFCAC4"/>
      <text x="42" y="164" font-size="46" font-weight="900" fill="#000">開餐廳的老闆看過來</text>
      <path d="M40 178H452" stroke="#FCD501" stroke-width="16" stroke-linecap="round" opacity=".9"/>
      <rect x="42" y="208" width="640" height="16" rx="8" fill="#CFCAC4"/>
      <rect x="42" y="242" width="480" height="16" rx="8" fill="#CFCAC4"/>
      <!-- 標註 -->
      <path d="M600 150H492" stroke="#C7302F" stroke-width="5" stroke-linecap="round"/>
      <path d="M498 136l-22 14 22 14z" fill="#C7302F"/>
      <text x="616" y="161" font-size="30" font-weight="900" fill="#C7302F">講出要找誰</text>
    </svg></div>
    <div class="viz" style="width:832px;height:300px;margin:auto 0"><svg width="832" height="300" viewBox="0 0 832 300" xmlns="http://www.w3.org/2000/svg">
      <!-- 對號入座 -->
      <rect x="0" y="0" width="406" height="300" rx="24" fill="#FFF3B0"/>
      <circle cx="203" cy="100" r="34" fill="#AED056" stroke="#000" stroke-width="4"/>
      <rect x="166" y="140" width="74" height="80" rx="28" fill="#AED056" stroke="#000" stroke-width="4"/>
      <path d="M244 120l40-46" stroke="#000" stroke-width="10" stroke-linecap="round"/>
      <text x="203" y="270" text-anchor="middle" font-size="32" font-weight="900" fill="#000">老闆：在說我</text>
      <!-- 滑掉 -->
      <rect x="426" y="0" width="406" height="300" rx="24" fill="#F0F0EE"/>
      <circle cx="600" cy="100" r="34" fill="#D6D3CF" stroke="#000" stroke-width="4"/>
      <rect x="563" y="140" width="74" height="80" rx="28" fill="#D6D3CF" stroke="#000" stroke-width="4"/>
      <path d="M672 120H760" stroke="#555" stroke-width="7" stroke-linecap="round"/>
      <path d="M754 104l22 16-22 16z" fill="#555"/>
      <text x="629" y="270" text-anchor="middle" font-size="32" font-weight="900" fill="#555">不是你的人：滑掉</text>
    </svg></div>
  </div>
  <div class="bpill">與其鎖到只剩三萬人，不如開寬點名</div>
</div>

<!-- 5 禾言怎麼做 -->
<div class="card" id="p5" data-document-role="page" data-label="禾言怎麼做">
  <div class="corner tl"><svg viewBox="0 0 100 100"><path d="M50 0c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z" fill="#FCD501"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 100 100"><path d="M50 0c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z" fill="#FCD501"/></svg></div>
  <div class="hylogo"><img src="https://zhuer0323-tech.github.io/dora-workspace/heyen-cards/logo_use.png" alt="禾言數位行銷"></div>
  <div class="paper yellow">
    <div class="flag">禾言怎麼做</div>
    <h2>精準從<span class="hl">內容</span>來<br>不是勾選框</h2>
    <div class="note" style="margin-top:36px"><div>接手帳戶，我們常先把受眾放寬<br><span class="s">➤ 省下的力氣，全花回素材上</span></div></div>
    <div class="viz" style="width:832px;height:420px;margin:auto 0 0"><svg width="832" height="420" viewBox="0 0 832 420" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="832" height="420" rx="24" fill="#fff"/>
      <path d="M60 360H772" stroke="#000" stroke-width="5" stroke-linecap="round"/>
      <!-- 設定：有天花板 -->
      <path d="M140 210H360" stroke="#C7302F" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/>
      <text x="250" y="190" text-anchor="middle" font-size="26" font-weight="900" fill="#C7302F">能做的就這麼多</text>
      <rect x="190" y="220" width="120" height="140" rx="12" fill="#D6D3CF" stroke="#000" stroke-width="4"/>
      <text x="250" y="402" text-anchor="middle" font-size="32" font-weight="900" fill="#000">設定</text>
      <!-- 內容：往上沒有上限 -->
      <rect x="522" y="90" width="120" height="270" rx="12" fill="#FCD501" stroke="#000" stroke-width="4"/>
      <path d="M582 84V36" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-dasharray="4 14"/>
      <path d="M562 44l20-28 20 28z" fill="#000"/>
      <text x="700" y="64" font-size="26" font-weight="900" fill="#000">沒有上限</text>
      <text x="582" y="402" text-anchor="middle" font-size="32" font-weight="900" fill="#000">內容</text>
    </svg></div>
  </div>
  <div class="bpill">你的受眾設多窄？留言我們幫你看</div>
</div>

</body>
</html>
