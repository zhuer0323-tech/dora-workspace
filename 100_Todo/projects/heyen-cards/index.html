<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>禾言圖卡・國慶連假快樂</title>
<link rel="stylesheet" href="fonts/bold/GenJyuuGothic-Bold.css">
<link rel="stylesheet" href="fonts/medium/GenJyuuGothic-Medium.css">
<style>
:root{
  --y:#FCD501; --y2:#FFCA26; --y3:#FFEDC5; --g:#AED056;
  --cream:#FFF9F6; --mint:#C9E6E4; --ink:#000; --red:#C7302F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#555;font-family:'GenJyuu Gothic','GenJyuuGothic','源柔ゴシック',"PingFang TC","Heiti TC","Noto Sans TC",sans-serif}

.card{
  width:1080px;height:1350px;position:relative;overflow:hidden;
  background:#F0F0EE;
  background-image:
    linear-gradient(rgba(0,0,0,.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.09) 1px, transparent 1px);
  background-size:34px 34px;
  margin:0 auto;
}
.paper{
  position:absolute;left:66px;top:170px;right:66px;bottom:132px;
  background:var(--cream);border:none;border-radius:38px;
  box-shadow:14px 14px 0 var(--y2), 14px 14px 0 4px var(--ink);
  padding:62px 58px;display:flex;flex-direction:column;
}
.paper.yellow{background:var(--y)}

.corner{position:absolute;width:230px;height:230px;z-index:0}
.corner.tl{left:-92px;top:-98px}
.corner.br{right:-92px;bottom:-98px;transform:rotate(180deg)}
.corner svg{width:100%;height:100%;display:block}
.hylogo{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:290px;z-index:6}
.hylogo img{width:100%;display:block}
.flag{position:absolute;left:-14px;top:-24px;z-index:5;background:#AED056;
  padding:14px 40px 14px 26px;font-size:31px;font-weight:900;
  clip-path:polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%)}
.bpill{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
  background:#C9E6E4;border-radius:20px;padding:14px 34px;
  font-size:30px;font-weight:900;white-space:nowrap;z-index:4}

h1{position:relative;z-index:2;font-size:90px;line-height:1.3;font-weight:900;letter-spacing:-2px}
h1 .u{background:linear-gradient(transparent 60%, var(--y) 60%)}
h2{position:relative;z-index:2;font-size:66px;font-weight:900;line-height:1.32;letter-spacing:-1px;margin-top:30px}
h2 .hl{background:linear-gradient(transparent 7%, var(--y) 7%, var(--y) 93%, transparent 93%);
  color:var(--ink);padding:4px 16px;display:inline-block}
.paper.yellow h2 .hl{background:none;color:var(--red);padding:0}

/* 單張：類型小標／主標／一個視覺（國慶 10/10 日曆＋煙火） */
.paper.cover{justify-content:center;align-items:center;text-align:center}
.paper.cover h1{font-size:132px;line-height:1.2;letter-spacing:-4px;margin-top:10px}
.viz{position:relative;z-index:2;display:block;flex:none;margin-top:30px}
</style>
</head>
<body>

<!-- 單張 國慶祝賀 -->
<div class="card" id="p1" data-document-role="page" data-label="國慶連假快樂">
  <div class="corner tl"><svg viewBox="0 0 100 100"><path d="M50 0c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z" fill="#FCD501"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 100 100"><path d="M50 0c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z" fill="#FCD501"/></svg></div>
  <div class="hylogo"><img src="https://zhuer0323-tech.github.io/dora-workspace/heyen-cards/logo_use.png" alt="禾言數位行銷"></div>
  <div class="paper cover">
    <div class="flag">日常/節慶</div>
    <h1>國慶連假<br><span class="u">快樂</span>！</h1>
    <div class="viz" style="width:744px;height:500px"><svg width="744" height="500" viewBox="0 0 832 560" xmlns="http://www.w3.org/2000/svg">
      <!-- 國慶煙火 -->
      <g transform="translate(120 130)" stroke="#C7302F" stroke-width="7" stroke-linecap="round"><path d="M0 -38V-100" transform="rotate(0)"/><path d="M0 -38V-100" transform="rotate(30)"/><path d="M0 -38V-100" transform="rotate(60)"/><path d="M0 -38V-100" transform="rotate(90)"/><path d="M0 -38V-100" transform="rotate(120)"/><path d="M0 -38V-100" transform="rotate(150)"/><path d="M0 -38V-100" transform="rotate(180)"/><path d="M0 -38V-100" transform="rotate(210)"/><path d="M0 -38V-100" transform="rotate(240)"/><path d="M0 -38V-100" transform="rotate(270)"/><path d="M0 -38V-100" transform="rotate(300)"/><path d="M0 -38V-100" transform="rotate(330)"/></g><circle cx="120" cy="130" r="16" fill="#C7302F"/>
      <g transform="translate(712 110)" stroke="#FFCA26" stroke-width="8" stroke-linecap="round"><path d="M0 -34V-90" transform="rotate(0)"/><path d="M0 -34V-90" transform="rotate(30)"/><path d="M0 -34V-90" transform="rotate(60)"/><path d="M0 -34V-90" transform="rotate(90)"/><path d="M0 -34V-90" transform="rotate(120)"/><path d="M0 -34V-90" transform="rotate(150)"/><path d="M0 -34V-90" transform="rotate(180)"/><path d="M0 -34V-90" transform="rotate(210)"/><path d="M0 -34V-90" transform="rotate(240)"/><path d="M0 -34V-90" transform="rotate(270)"/><path d="M0 -34V-90" transform="rotate(300)"/><path d="M0 -34V-90" transform="rotate(330)"/></g><circle cx="712" cy="110" r="14" fill="#FFCA26"/>
      <g transform="translate(740 330)" stroke="#AED056" stroke-width="7" stroke-linecap="round"><path d="M0 -22V-60" transform="rotate(0)"/><path d="M0 -22V-60" transform="rotate(36)"/><path d="M0 -22V-60" transform="rotate(72)"/><path d="M0 -22V-60" transform="rotate(108)"/><path d="M0 -22V-60" transform="rotate(144)"/><path d="M0 -22V-60" transform="rotate(180)"/><path d="M0 -22V-60" transform="rotate(216)"/><path d="M0 -22V-60" transform="rotate(252)"/><path d="M0 -22V-60" transform="rotate(288)"/><path d="M0 -22V-60" transform="rotate(324)"/></g><circle cx="740" cy="330" r="9" fill="#AED056"/>
      <g transform="translate(96 370)" stroke="#7BBDB8" stroke-width="7" stroke-linecap="round"><path d="M0 -22V-58" transform="rotate(0)"/><path d="M0 -22V-58" transform="rotate(36)"/><path d="M0 -22V-58" transform="rotate(72)"/><path d="M0 -22V-58" transform="rotate(108)"/><path d="M0 -22V-58" transform="rotate(144)"/><path d="M0 -22V-58" transform="rotate(180)"/><path d="M0 -22V-58" transform="rotate(216)"/><path d="M0 -22V-58" transform="rotate(252)"/><path d="M0 -22V-58" transform="rotate(288)"/><path d="M0 -22V-58" transform="rotate(324)"/></g><circle cx="96" cy="370" r="9" fill="#7BBDB8"/>
      <!-- 10/10 日曆 -->
      <rect x="252" y="130" width="328" height="380" rx="30" fill="#fff" stroke="#000" stroke-width="6"/>
      <path d="M252 222V160a30 30 0 0 1 30-30h268a30 30 0 0 1 30 30v62z" fill="#FCD501" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
      <rect x="318" y="100" width="20" height="64" rx="10" fill="#000"/>
      <rect x="494" y="100" width="20" height="64" rx="10" fill="#000"/>
      <text x="416" y="200" text-anchor="middle" font-size="46" font-weight="900" fill="#000">10月</text>
      <text x="416" y="400" text-anchor="middle" font-size="190" font-weight="900" fill="#C7302F" letter-spacing="-6">10</text>
      <text x="416" y="470" text-anchor="middle" font-size="40" font-weight="900" fill="#000">國慶日</text>
    </svg></div>
  </div>
</div>

</body>
</html>
