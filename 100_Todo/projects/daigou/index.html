<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>代購許願池</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#E57399">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="代購許願池">
<style>
/* 配色沿用工作台（100_Todo/projects/index.html 的 :root），狀態四色也一樣：待確認黃、買到綠、部分藍、沒買到紅 */
:root{
  --bg:#FFF5F7; --card:#FFFFFF;
  --pink:#F48FB1; --pink-d:#E57399; --pink-l:#FFD9E3; --pink-xl:#FFF0F4;
  --ink:#5B3C46; --ink2:#8C6B76; --ink3:#B79AA4; --line:#F6DCE4;
  --todo-b:#FFF2CC; --todo-t:#8A6410; --doing-b:#DDF3E7; --doing-t:#226B47;
  --done-b:#DCEBF7; --done-t:#22597F; --over-b:#FBE0E4; --over-t:#A12838;
  --shadow:0 2px 10px rgba(232,150,178,.13); --shadow-l:0 6px 22px rgba(232,150,178,.22);
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:#F6EEF0;font-weight:600}
button.pri{background:var(--pink-d);color:#fff}
button.ghost{background:#fff;border:1.5px solid var(--line)}
button.sm{padding:6px 11px;font-size:13px;border-radius:10px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:12.5px;color:var(--ink3);margin:12px 0 4px}
.hint{font-size:12px;color:var(--ink2)}
.err{color:var(--over-t);font-size:14px;min-height:20px;margin-top:8px}
[hidden]{display:none!important}
.sp{flex:1}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

/* 登入 */
#gate{max-width:380px;margin:0 auto;padding:56px 16px 40px}
#gate h1{font-size:26px;margin:0 0 4px;text-align:center}
#gate .lead{text-align:center;color:var(--ink2);margin:0 0 22px}
.gbox{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.row2{display:flex;gap:8px;margin-top:16px}
.row2>*{flex:1}
details.owner{margin-top:28px;text-align:center}
details.owner summary{color:var(--ink3);font-size:13px;cursor:pointer;list-style:none}
details.owner .gbox{margin-top:10px;text-align:left}

/* 上方 */
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#fff,var(--pink-xl));border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.top{display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto}
.top h2{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top select{width:auto;max-width:55%;padding:4px 10px;font-size:13px;border-radius:999px;color:var(--ink2)}
nav{display:flex;gap:4px;max-width:760px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:transparent;border-radius:12px 12px 0 0;padding:8px 12px;color:var(--ink2);font-weight:500;font-size:14px}
nav button.on{background:var(--bg);color:var(--pink-d);font-weight:700;box-shadow:inset 0 3px 0 var(--pink)}
main{max-width:760px;margin:0 auto;padding:6px 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.foot{text-align:center;padding:0 16px 30px;font-size:12px;color:var(--ink3)}

/* 區塊標題＋分隔線 */
.sec{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--pink-d);margin-top:10px}
.sec::after{content:"";flex:1;height:1.5px;background:var(--pink-l)}
.sec em{font-style:normal;font-weight:400;color:var(--ink3)}
.sec button{order:3}

/* 卡片：淡粉卡頭＋白卡身 */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ch{background:var(--pink-xl);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;font-weight:700}
.cb{padding:12px 14px}
.empty{text-align:center;color:var(--ink2);padding:28px 12px}
.chip{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:600;white-space:nowrap;vertical-align:middle}
.c-open{background:var(--doing-b);color:var(--doing-t)}
.c-closed{background:var(--over-b);color:var(--over-t)}
.c-gray{background:#F3ECEE;color:var(--ink2)}
.c-pink{background:var(--pink-l);color:var(--pink-d)}
.s-wait{background:var(--todo-b);color:var(--todo-t)} .s-got{background:var(--doing-b);color:var(--doing-t)}
.s-part{background:var(--done-b);color:var(--done-t)} .s-none{background:var(--over-b);color:var(--over-t)}
.notice{white-space:pre-wrap}
.rate{font-size:12px;color:var(--ink2);background:var(--pink-xl);border-radius:10px;padding:7px 10px;margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px;align-items:center}
.kv dt{color:var(--ink3);font-size:13px} .kv dd{margin:0}
.av{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:0 0 auto}

/* 商品牆 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.item .ph{aspect-ratio:1/1;max-width:100%;background:var(--pink-xl);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:13px;position:relative}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.item .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.item .nm{font-weight:700;line-height:1.35}
.item .sp2{font-size:12px;color:var(--ink3)}
.item .pr{margin-top:auto;padding-top:6px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.item .pr b{font-size:17px;color:var(--pink-d);font-variant-numeric:tabular-nums}
.item .pr span{font-size:12px;color:var(--ink3)}
.item.sold{opacity:.55}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--pink-xl);border-radius:12px;margin-top:6px}
.qty button{width:38px;height:36px;padding:0;font-size:18px;background:transparent;color:var(--pink-d)}
.qty b{min-width:24px;text-align:center}
.addbtn{width:100%;margin-top:6px}

/* 訂單列 */
.line{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.card>.line:first-child,.ch+.line{border-top:0}
.thumbs{display:flex;gap:4px;flex:0 0 auto}
.tw{position:relative}
.thumbs img,.th0{width:58px;height:58px;border-radius:12px;object-fit:cover;background:var(--pink-xl);cursor:zoom-in;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:11px}
.tw .more{position:absolute;inset:0;border-radius:12px;background:rgba(91,60,70,.5);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:none}
.line .info{flex:1;min-width:0}
.line .nm{font-weight:700}
.line .meta{font-size:12px;color:var(--ink3);white-space:pre-wrap}
.line .amt{text-align:right;white-space:nowrap;font-size:14px;font-variant-numeric:tabular-nums}
.line .amt b{font-size:15px}
.brk{font-size:11.5px;color:var(--ink3)}
.from{font-size:10.5px;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;font-weight:400;vertical-align:middle}
.line .lctl{flex-basis:100%;margin-top:-2px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-left:68px}
@media(min-width:620px){.ctl{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ctl input,.ctl select{padding:7px 9px;font-size:14px;border-radius:10px}
.ctl .full{grid-column:1/-1}
.mini{font-size:11px;color:var(--ink3);margin-bottom:2px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 4px;background:var(--pink-xl);border-top:1.5px dashed var(--pink-l)}
.tot b{font-size:22px;color:var(--pink-d);font-variant-numeric:tabular-nums}
.totn{background:var(--pink-xl);padding:0 14px 12px}
.who{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.who .n{flex:1;min-width:0}
.who select{width:auto;padding:5px 8px;font-size:13px;border-radius:10px}
.who input{width:68px;padding:5px 8px;font-size:13px;border-radius:10px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px}
.kpi small{display:block;font-size:12px;color:var(--ink3)}
.kpi b{font-size:18px;font-variant-numeric:tabular-nums}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;margin:0;color:var(--ink)}
.chk input{width:20px;height:20px;accent-color:var(--pink-d)}
.tiers .tr{display:grid;grid-template-columns:1.2fr 1fr 1fr 34px;gap:6px;margin-top:6px;align-items:center}
.tiers .tr input,.tiers .tr select{padding:7px 8px;font-size:14px}
.tiers .tr button{padding:6px 0}

/* 視窗 */
.modal{position:fixed;inset:0;background:rgba(91,60,70,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:620px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 4px}
.pics{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pics .p{position:relative}
.pics img{width:76px;height:76px;object-fit:cover;border-radius:12px;display:block;cursor:zoom-in}
.pics .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;padding:0;border-radius:50%;background:var(--ink);color:#fff;font-size:12px}
.pics .addp{width:76px;height:76px;border:2px dashed var(--pink-l);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--pink);font-size:26px;cursor:pointer;background:#fff;margin:0}

/* 看大圖 */
#zoom{position:fixed;inset:0;background:rgba(30,18,22,.94);z-index:30;display:flex;flex-direction:column}
.zbar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#fff}
.zbar button{background:rgba(255,255,255,.16);color:#fff;font-size:14px;padding:8px 13px}
.zstage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.zstage img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;display:block;-webkit-touch-callout:default;user-select:none}
.zstage.big{display:block}
.zstage.big img{max-width:none;max-height:none;cursor:zoom-out;margin:auto}
.znav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;padding:0;font-size:30px;background:rgba(255,255,255,.14);color:#fff;border-radius:12px}
.znav.prev{left:calc(8px + env(safe-area-inset-left))} .znav.next{right:calc(8px + env(safe-area-inset-right))}
.zhint{color:rgba(255,255,255,.72);font-size:12px;text-align:center;padding:8px 14px calc(12px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>
<body>

<!-- 登入 -->
<div id="gate">
  <h1>代購許願池</h1>
  <p class="lead">用暱稱和 6 位數字密碼進來</p>
  <form class="gbox" id="fForm" autocomplete="on">
    <label for="fNick" style="margin-top:0">暱稱</label>
    <input id="fNick" maxlength="20" autocomplete="username" placeholder="例如：小美">
    <label for="fPass">密碼（6 位數字）</label>
    <input id="fPass" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" placeholder="••••••">
    <div class="row2">
      <button type="submit" class="pri" id="fLogin">登入</button>
      <button type="button" class="ghost" id="fSign">第一次報名</button>
    </div>
    <p class="hint" style="margin:12px 0 0">第一次來請按「第一次報名」，自己設一組 6 位數字密碼。換手機時用同一組暱稱和密碼登入，就看得到原本的單。</p>
  </form>
  <div class="err" id="gateErr"></div>
  <details class="owner">
    <summary>團主登入</summary>
    <div class="gbox">
      <button type="button" class="pri" id="gBtn" style="width:100%">用 Google 登入</button>
      <form id="oForm" style="margin-top:8px">
        <label for="oEmail">或用 email 與密碼</label>
        <input id="oEmail" type="email" autocomplete="username">
        <input id="oPass" type="password" autocomplete="current-password" style="margin-top:6px">
        <button type="submit" class="ghost" style="width:100%;margin-top:8px">登入</button>
      </form>
    </div>
  </details>
</div>

<!-- 主畫面 -->
<div id="app" hidden>
  <header>
    <div class="top">
      <h2>代購許願池</h2>
      <select id="tripSel" aria-label="切換哪一趟"></select>
    </div>
    <nav id="tabs"></nav>
  </header>
  <main id="main"></main>
  <div class="foot"><span id="whoami"></span> · <button class="sm ghost" id="outBtn">登出</button></div>
</div>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="zoom" hidden>
  <div class="zbar"><span id="zCount" class="num"></span><span class="sp"></span><button id="zBig">放大</button><button id="zClose">關閉</button></div>
  <div class="zstage" id="zStage"><img id="zImg" alt=""></div>
  <button class="znav prev" id="zPrev" aria-label="上一張">‹</button><button class="znav next" id="zNext" aria-label="下一張">›</button>
  <div class="zhint">點圖片放大成原始尺寸，可拖曳看細節；兩指也能縮放。長按可存到手機。</div>
</div>
<div id="toast"></div>

<script type="module">
/* ============================================================
   代購許願池
   - 朋友：暱稱＋6 位數字密碼（背後是 Firebase 的 email 帳號，email 由暱稱算出來，不是真的信箱）
   - 團主：跟工作台同一個帳號登入，看得到全部
   - 資料：Firebase 同專案的獨立節點 ROOM，規則見計劃書；朋友只讀得到自己的訂單
   - 程式碼在公開倉庫：朋友名字、訂單、收款資訊都只存在雲端，這裡不寫任何真資料
   ============================================================ */
const ROOM = 'dg_r4n8w2qk';                 // 改名要同步改 Firebase 規則
const FRIEND_DOMAIN = '@dg.invalid';        // 朋友帳號的假 email 結尾
const OWNER_HASH = '5d0e25f26b9be53c3a58a198657847c71c08407af36fe8df409ace6993bd2b4a';
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAWOXPFBmb-lU90dpBOq2B8Gn7LsR2p-jM",
  authDomain: "busan-trip-2026-201f8.firebaseapp.com",
  databaseURL: "https://busan-trip-2026-201f8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "busan-trip-2026-201f8",
  storageBucket: "busan-trip-2026-201f8.firestorage.app",
  messagingSenderId: "300878890409",
  appId: "1:300878890409:web:c80543dc5c43f6d81bb0b8"
};
const CUR = { KRW:{ sym:'₩', name:'韓元' }, JPY:{ sym:'¥', name:'日圓' } };
// 代購費級距：成本（台幣，四捨五入後）≤ max 就用這一級；最後一級沒有 max
const DEF_CFG = { cardPct:1.5, tiers:[
  { max:300, fix:50 }, { max:600, fix:90 }, { max:1000, fix:120 }, { max:2000, pct:15 }, { pct:12 } ] };
const ST = { wait:'待確認', got:'買到了', part:'部分買到', none:'沒買到' };
const AV_COLORS = ['#E57399','#7FB6E0','#6FC79A','#F2B24B','#B38AD6','#E0896B'];
// 截圖上傳畫質：長邊像素、JPEG 品質（雲端規則擋單張 1,200,000 字元，改大要一起改）
const IMG_MAX = 1600, IMG_Q = .8;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const twd = n => '$' + Math.round(n).toLocaleString('en-US');
const ymd = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const ls = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
             set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('on'), 2200); }
async function sha256hex(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s||'').trim().toLowerCase()));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
const normNick = s => String(s||'').normalize('NFKC').trim().replace(/\s+/g,' ');
async function nickEmail(nick){ return 'u' + (await sha256hex(normNick(nick))).slice(0, 24) + FRIEND_DOMAIN; }
const imgsOf = x => Array.isArray(x) ? x.filter(Boolean) : Object.values(x || {}).filter(Boolean);

/* ---------- 狀態 ---------- */
let S = { trips:{}, cfg:DEF_CFG, wall:{}, users:{}, orders:{} };
let role = null, me = null, myNick = '';
let tid = ls.get('dg_tid') || '';
let tab = null;
let liveRate = {};
let fb = null;            // {db, ref, set}

/* ---------- 看大圖：每次畫面重畫時登記圖組，點縮圖就能左右翻 ---------- */
let GAL = [];
function gal(imgs){ GAL.push(imgs); return GAL.length - 1; }
const zoomAttr = (g, i) => `data-zoom="${g}:${i}"`;
let _z = { list:[], i:0 };
function zoomOpen(list, i){
  _z = { list, i }; $('#zoom').hidden = false; document.body.style.overflow = 'hidden'; zoomShow();
}
function zoomShow(){
  const st = $('#zStage'); st.classList.remove('big'); $('#zBig').textContent = '放大';
  $('#zImg').style.width = ''; $('#zImg').src = _z.list[_z.i];
  const n = _z.list.length;
  $('#zCount').textContent = n > 1 ? `${_z.i+1} / ${n}` : '';
  $('#zPrev').hidden = $('#zNext').hidden = n < 2;
}
function zoomToggle(){
  const st = $('#zStage'), img = $('#zImg');
  if(st.classList.contains('big')){ st.classList.remove('big'); img.style.width = ''; $('#zBig').textContent = '放大'; return; }
  // 放大到原始尺寸，至少螢幕寬的 2 倍，才看得清截圖裡的小字
  const w = Math.max(img.naturalWidth || 0, st.clientWidth * 2);
  st.classList.add('big'); img.style.width = w + 'px'; $('#zBig').textContent = '縮回';
  st.scrollLeft = (st.scrollWidth - st.clientWidth) / 2; st.scrollTop = (st.scrollHeight - st.clientHeight) / 2;
}
function zoomGo(d){ const n = _z.list.length; if(n < 2) return; _z.i = (_z.i + d + n) % n; zoomShow(); }
function zoomClose(){ $('#zoom').hidden = true; document.body.style.overflow = ''; $('#zImg').src = ''; }
$('#zClose').onclick = zoomClose;
$('#zBig').onclick = zoomToggle;
$('#zImg').onclick = zoomToggle;
$('#zPrev').onclick = () => zoomGo(-1);
$('#zNext').onclick = () => zoomGo(1);
$('#zStage').addEventListener('click', e => { if(e.target.id === 'zStage' && !$('#zStage').classList.contains('big')) zoomClose(); });
// 沒放大時左右滑換張
let _sx = null;
$('#zStage').addEventListener('touchstart', e => { _sx = e.touches.length === 1 && !$('#zStage').classList.contains('big') ? e.touches[0].clientX : null; }, { passive:true });
$('#zStage').addEventListener('touchend', e => {
  if(_sx == null) return; const dx = e.changedTouches[0].clientX - _sx; _sx = null;
  if(Math.abs(dx) > 50) zoomGo(dx < 0 ? 1 : -1);
});
document.addEventListener('keydown', e => {

  if(e.key === 'Escape') zoomClose(); if(e.key === 'ArrowLeft') zoomGo(-1); if(e.key === 'ArrowRight') zoomGo(1);

/* ---------- 匯率 ---------- */
async function loadRate(){
  try{ const c = JSON.parse(ls.get('dg_rate') || 'null'); if(c && c.d === ymd()){ liveRate = c.r; return; } }catch(e){}
  try{
    const j = await (await fetch('https://open.er-api.com/v6/latest/TWD')).json();
    if(j.result === 'success'){ liveRate = { KRW:j.rates.KRW, JPY:j.rates.JPY }; ls.set('dg_rate', JSON.stringify({ d:ymd(), r:liveRate })); }
  }catch(e){ console.warn('rate', e); }
}
// 一律存「1 台幣換多少外幣」
const rateOf = t => t ? (num(t.rateFinal) || num(t.rate?.v) || num(liveRate[t.cur])) : null;
const isFinal = t => !!num(t?.rateFinal);
function rateText(t){
  const r = rateOf(t); if(!r) return '匯率還沒抓到';
  const c = CUR[t.cur]?.name || t.cur;
  const tag = isFinal(t) ? '刷卡入帳匯率（確定）' : `預估匯率${t.rate?.d ? '（' + t.rate.d.slice(5).replace('-','/') + ' 更新）' : ''}`;
  return `${tag}：1 台幣 ≈ ${r.toFixed(2)} ${c}（1 ${c} ≈ ${(1/r).toFixed(4)} 台幣）`;
}
function syncTripRates(){
  if(role !== 'owner') return;
  Object.entries(S.trips).forEach(([id, t]) => {
    if(isFinal(t) || t.rate?.d === ymd() || !liveRate[t.cur]) return;
    put(`trips/${id}/rate`, { v:liveRate[t.cur], d:ymd() });
  });
}

/* ---------- 計價 ---------- */
function tierOf(cost){
  const c = Math.round(cost);
  const tiers = Array.isArray(S.cfg?.tiers) ? S.cfg.tiers : DEF_CFG.tiers;
  return tiers.find(x => x.max == null || c <= +x.max) || tiers[tiers.length-1];
}
function quote(local, t, feeOv){
  const p = num(local), r = rateOf(t);
  if(p == null || !r) return null;
  const cost = p / r;
  const card = cost * (num(S.cfg?.cardPct) ?? DEF_CFG.cardPct) / 100;
  let fee;
  if(num(feeOv) != null) fee = num(feeOv);
  else { const x = tierOf(cost); fee = x.fix != null ? +x.fix : cost * (+x.pct) / 100; }
  return { cost, card, fee, unit: Math.round(cost + card + fee) };
}
function linesOf(t_id, uid){
  const o = S.orders?.[t_id]?.[uid] || {}, a = o.a || {}, out = [];
  Object.entries(o.w || {}).forEach(([id, w]) => {
    const ad = a['w_'+id] || {};
    out.push({ key:'w_'+id, kind:'w', id, name:w.name, spec:w.spec, note:w.note, qty:+w.qty||1, maxTwd:w.maxTwd,
      imgs:imgsOf(w.imgs), price:ad.price, st:ad.st||'wait', got:ad.got, feeOv:ad.feeOv, ts:w.ts||0 });
  });
  Object.entries(o.c || {}).forEach(([wid, c]) => {
    const it = S.wall?.[t_id]?.[wid] || {}, ad = a['c_'+wid] || {};
    out.push({ key:'c_'+wid, kind:'c', id:wid, name:it.name || '（已下架的商品）', spec:[it.spec, c.opt].filter(Boolean).join('・'),
      qty:+c.qty||1, imgs:it.img ? [it.img] : [], price:it.price, st:ad.st||'wait', got:ad.got, feeOv:ad.feeOv, ts:c.ts||0 });
  });
  return out.sort((x,y) => x.ts - y.ts);
}
const billQty = l => l.st === 'got' ? l.qty : l.st === 'part' ? (num(l.got) || 0) : l.st === 'none' ? 0 : l.qty;
function orderTotal(t_id, uid){
  const t = S.trips[t_id], lines = linesOf(t_id, uid);
  let total = 0, noPrice = 0, wait = 0;
  lines.forEach(l => {
    if(l.st === 'wait') wait++;
    const q = billQty(l); if(!q) return;
    const qt = quote(l.price, t, l.feeOv);
    if(!qt){ noPrice++; return; }
    total += qt.unit * q;
  });
  return { total, noPrice, wait, final: isFinal(t) && !wait && !noPrice, lines };
}

/* ---------- 趟次 ---------- */
const tripList = () => Object.entries(S.trips || {})
  .filter(([,t]) => role === 'owner' || !t.hidden)
  .sort((a,b) => (a[1].ts||0) - (b[1].ts||0));
const curTrip = () => S.trips?.[tid];
const isOpen = t => !!t && !(num(t.closeMs) && Date.now() >= num(t.closeMs));
function closeText(t){
  if(!num(t.closeMs)) return '目前沒有截止時間';
  const d = new Date(+t.closeMs), w = '日一二三四五六'[d.getDay()];
  const s = `${d.getMonth()+1}/${d.getDate()}（${w}）${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  if(!isOpen(t)) return `已在 ${s} 收單`;
  const days = Math.ceil((+t.closeMs - Date.now()) / 86400000);
  return `收單到 ${s}${days <= 1 ? '，今天截止' : `，還有 ${days} 天`}`;
}

/* ---------- 寫入 ---------- */
function put(path, val){
  if(!fb) return Promise.reject(new Error('還沒連上'));
  return fb.set(fb.ref(fb.db, `${ROOM}/${path}`), val).catch(e => { console.error(path, e); toast(errMsg(e)); throw e; });
}
const del = path => put(path, null);
function errMsg(e){
  const m = String(e?.message || e);
  if(m.includes('PERMISSION_DENIED') || m.includes('permission')) return '存不進去：可能已經收單了，或圖片太大';
  return '存檔失敗，確認網路後再試一次';
}

const wallItems = t_id => Object.entries(S.wall?.[t_id] || {}).sort((a,b) => (b[1].ts||0) - (a[1].ts||0));

function thumbsHtml(imgs){
  if(!imgs.length) return `<div class="th0">沒圖</div>`;
  const g = gal(imgs);
  return imgs.slice(0,2).map((s,i) => `<div class="tw"><img src="${s}" ${zoomAttr(g, i)} alt="">${i === 1 && imgs.length > 2 ? `<span class="more">+${imgs.length-2}</span>` : ''}</div>`).join('');
}
function lineHtml(l, t, ctl, extraMeta){
  const q = quote(l.price, t, l.feeOv), bq = billQty(l);
  const amt = num(l.price) == null ? `<span class="hint">待報價</span>`
    : !q ? '' : l.st === 'none' ? `<span class="hint">不收費</span>`
    : `<b>${twd(q.unit * bq)}</b><div class="brk">${twd(q.unit)} × ${bq}</div>`;
  const meta = [extraMeta, l.spec, num(l.maxTwd) ? `最高可接受 ${twd(l.maxTwd)}` : '', l.note].filter(Boolean).join('・');
  return `<div class="line"><div class="thumbs">${thumbsHtml(l.imgs)}</div><div class="info">
    <div class="nm">${esc(l.name)} <span class="hint">× ${l.qty}</span><span class="from">${l.kind === 'w' ? '許願' : '商品牆'}</span></div>
    ${meta ? `<div class="meta">${esc(meta)}</div>` : ''}
    <span class="chip s-${l.st}">${ST[l.st]}${l.st==='part' ? ` ${num(l.got)||0} 件` : ''}</span>
    </div><div class="amt">${amt}</div>${ctl ? `<div class="lctl">${ctl}</div>` : ''}</div>`;
}

function reconText(uid){
  const t = curTrip(), o = orderTotal(tid, uid);
  const got = o.lines.filter(l => billQty(l) > 0), none = o.lines.filter(l => l.st === 'none');
  const out = [`【${t.name} 代購對帳】${nickOf(uid)}`, ''];
  got.forEach(l => { const q = quote(l.price, t, l.feeOv);
    out.push(`・${l.name}${l.spec ? `（${l.spec}）` : ''} × ${billQty(l)}　${q ? twd(q.unit * billQty(l)) : '待報價'}`); });
  if(none.length) out.push('', '沒買到：' + none.map(l => l.name).join('、'));
  out.push('', `合計：NT${twd(o.total)}${o.final ? '' : '（預估）'}`, rateText(t));
  out.push(`報價＝台幣成本＋刷卡手續費 ${num(S.cfg?.cardPct) ?? 1.5}%＋代購費`);
  if(t.payInfo) out.push('', t.payInfo);
  return out.join('\n');
}

// 手機上先縮再上傳：截圖要看得清楚小字，長邊 1600px
function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, IMG_MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = IMG_Q, out = c.toDataURL('image/jpeg', q);
      while(out.length > 1150000 && q > .45){ q -= .1; out = c.toDataURL('image/jpeg', q); }   // 超過雲端上限就再壓
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('這張圖讀不到')); };
    img.src = url;
  });
}

let _delArm = '';
document.addEventListener('click', async e => {
  const z = e.target.closest('[data-zoom]');
  if(z){ const [g, i] = z.dataset.zoom.split(':').map(Number); if(GAL[g]) zoomOpen(GAL[g], i); return; }
  const zp = e.target.closest('[data-zpics]');
  if(zp){ zoomOpen([..._pics], +zp.dataset.zpics); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id, t = curTrip();
  try{
  switch(act){
    case 'close': closeModal(); break;
    case 'picDel': _pics.splice(+b.dataset.i, 1); $('#pics').innerHTML = picsHtml(_picMax); break;

    case 'cart': {
      const n = Math.max(0, +(S.orders?.[tid]?.[me]?.c?.[id]?.qty || 0) + +b.dataset.d);
      if(n) await put(`orders/${tid}/${me}/c/${id}`, { qty:n, ts:S.orders?.[tid]?.[me]?.c?.[id]?.ts || Date.now() });
      else await del(`orders/${tid}/${me}/c/${id}`);
      if(+b.dataset.d > 0 && n === 1) toast('加進你的訂單了');
      break; }

    case 'wishNew': wishForm(); break;
    case 'wishEdit': wishForm(id); break;
    case 'wishDel':
      if(_delArm !== id){ _delArm = id; b.textContent = '再按一次刪除'; setTimeout(() => { _delArm = ''; }, 3000); break; }
      await del(`orders/${tid}/${me}/w/${id}`); toast('刪掉了'); break;

      const name = $('#wName').value.trim(), qty = Math.min(99, Math.max(1, parseInt($('#wQty').value) || 1));
      if(!name && !_pics.length){ $('#mErr').textContent = '至少放一張截圖或寫品名'; break; }

        maxTwd: num($('#wMax').value), imgs:_pics, ts: old.ts || Date.now() });

    case 'wallEdit': wallForm(id); break;
    case 'wallSold': await put(`wall/${tid}/${id}/soldOut`, S.wall[tid][id].soldOut ? null : true); break;
    case 'wallDel':
      if(_delArm !== id){ _delArm = id; b.textContent = '再按一次刪除'; setTimeout(() => { _delArm = ''; }, 3000); break; }
      await del(`wall/${tid}/${id}`); closeModal(); toast('刪掉了；朋友已加的那幾筆會顯示「已下架」'); break;
    case 'wallSave': {
      const name = $('#iName').value.trim(); if(!name){ $('#mErr').textContent = '要寫品名'; break; }

    await put(el.dataset.set, v).catch(()=>{});
    if(/\/st$/.test(el.dataset.set)) render();
  }
  if(el.dataset.chk){
    await put(el.dataset.chk, el.checked || null).catch(()=>{});
    await put(el.dataset.day, el.checked ? ymd() : null).catch(()=>{});
  }
});

/* ---------- Firebase ---------- */
const STEP_MS = { load:20000, state:6000, sign:20000, data:20000 };
function withTimeout(p, ms, msg){
  let t; const late = new Promise((_, rej) => { t = setTimeout(() => rej(new Error(msg)), ms); });
  return Promise.race([p, late]).finally(() => clearTimeout(t));
}
// iPhone 主畫面 App 偶爾 IndexedDB 不回應，登入元件會跟著卡死：1.5 秒沒回應就讓 Firebase 改用 localStorage
const _idbProbe = new Promise(res => {
  let done = false; const fin = ok => { if(done) return; done = true; res(ok); };
  try{
    if(typeof indexedDB !== 'object' || !indexedDB){ fin(true); return; }
    const rq = indexedDB.open('dora-idb-probe');
    rq.onsuccess = () => { try{ rq.result.close(); }catch(e){} fin(true); };
    rq.onerror = () => fin(false); rq.onblocked = () => fin(false);
  }catch(e){ fin(false); }
  setTimeout(() => fin(false), 1500);
}).then(ok => { if(!ok) try{ Object.defineProperty(window, 'indexedDB', { value:undefined, configurable:true }); }catch(e){} });

let _mods = null;
async function mods(){
  if(_mods) return _mods;
  await _idbProbe;
  const [a, au, d] = await withTimeout(Promise.all([
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js') ]),
    STEP_MS.load, '載入太久沒回應，確認網路後再試一次（卡在第 1 步）');
  const app = a.getApps()[0] || a.initializeApp(FIREBASE_CONFIG);
  return _mods = { a, au, d, app, auth: au.getAuth(app) };
}
async function currentUser(){
  const { au, auth } = await mods();
  return withTimeout(new Promise(res => { const un = au.onAuthStateChanged(auth, u => { un(); res(u); }); }), STEP_MS.state, 'state')
    .catch(e => { if(e.message !== 'state') throw e; return null; });
}
async function start(user){
  const { au, d, app, auth } = await mods();
  const owner = await sha256hex(user.email) === OWNER_HASH;
  if(!owner && !String(user.email || '').endsWith(FRIEND_DOMAIN)){ await au.signOut(auth); throw new Error('這個帳號不能用，請用暱稱登入'); }
  role = owner ? 'owner' : 'friend'; me = user.uid;
  tab = ls.get('dg_tab_' + role);
  const db = d.getDatabase(app);
  fb = { db, ref:d.ref, set:d.set };
  const R = p => d.ref(db, `${ROOM}/${p}`);
  const first = [];
  const listen = (p, fn) => first.push(new Promise((res, rej) => d.onValue(R(p), s => { fn(s.exists() ? s.val() : null); res(); render(); }, err => { console.error(p, err); rej(err); })));
  if(owner){
    listen('', v => { v = v || {}; S = { trips:v.trips||{}, cfg:v.cfg||DEF_CFG, wall:v.wall||{}, users:v.users||{}, orders:v.orders||{} }; syncTripRates(); });
  } else {
    const attached = new Set();
    listen('cfg', v => { S.cfg = v || DEF_CFG; });
    listen('wall', v => { S.wall = v || {}; });
    listen(`users/${me}`, v => { S.users = { [me]: v || {} }; myNick = v?.nick || myNick; whoami(); });
    listen('trips', v => {
      S.trips = v || {};
      Object.keys(S.trips).forEach(id => {
        if(attached.has(id)) return; attached.add(id);
        d.onValue(R(`orders/${id}/${me}`), s => { S.orders[id] = { [me]: s.exists() ? s.val() : {} }; render(); }, err => console.warn(err));
      });
    });
  }
  await withTimeout(Promise.all(first), STEP_MS.data, '讀資料太久沒回應，確認網路後再試一次（卡在第 4 步）');
  window._signOut = () => au.signOut(auth).then(() => location.reload());
  whoami();
  $('#gate').hidden = true; $('#app').hidden = false;
  render();
  loadRate().then(() => { syncTripRates(); render(); });
}
function whoami(){ $('#whoami').textContent = role === 'owner' ? '團主模式' : `你是 ${myNick || '朋友'}`; }
$('#outBtn').onclick = () => window._signOut ? window._signOut() : location.reload();

function authErr(e, signup){
  const m = String(e?.message || e || '');
  if(m.includes('email-already-in-use')) return '這個暱稱已經有人用了。如果是你，請按「登入」；不是的話換一個暱稱。';
  if(m.includes('invalid-credential') || m.includes('wrong-password') || m.includes('user-not-found'))
    return signup ? '報名失敗，再試一次' : '暱稱或密碼不對。第一次來請按「第一次報名」。';
  if(m.includes('too-many-requests')) return '試太多次了，過幾分鐘再試';
  if(m.includes('network-request-failed')) return '連不上網路，確認有網路再試一次';
  return m || '登入失敗，再試一次';
}
async function friendGo(signup){
  const nick = normNick($('#fNick').value), pass = $('#fPass').value.trim();
  $('#gateErr').textContent = '';
  if(!nick){ $('#gateErr').textContent = '請填暱稱'; return; }
  if(!/^\d{6}$/.test(pass)){ $('#gateErr').textContent = '密碼要剛好 6 位數字'; return; }
  const btn = signup ? $('#fSign') : $('#fLogin'), txt = btn.textContent;
  btn.disabled = true; btn.textContent = '處理中…';
  try{
    const { au, d, app, auth } = await mods();
    const email = await nickEmail(nick);
    const cred = await withTimeout(signup ? au.createUserWithEmailAndPassword(auth, email, pass) : au.signInWithEmailAndPassword(auth, email, pass),
      STEP_MS.sign, '送出太久沒回應，再試一次（卡在第 3 步）');
    myNick = nick;
    if(signup) await d.set(d.ref(d.getDatabase(app), `${ROOM}/users/${cred.user.uid}`), { nick, ts:Date.now() });
    await start(cred.user);
  }catch(e){ $('#gateErr').textContent = authErr(e, signup); }
  btn.disabled = false; btn.textContent = txt;
}
$('#fForm').onsubmit = e => { e.preventDefault(); friendGo(false); };
$('#fSign').onclick = () => friendGo(true);
$('#gBtn').onclick = async () => {
  $('#gateErr').textContent = '';
  try{ const { au, auth } = await mods(); const r = await au.signInWithPopup(auth, new au.GoogleAuthProvider()); await start(r.user); }
  catch(e){ $('#gateErr').textContent = authErr(e); }
};
$('#oForm').onsubmit = async e => {
  e.preventDefault(); $('#gateErr').textContent = '';
  try{ const { au, auth } = await mods(); const r = await au.signInWithEmailAndPassword(auth, $('#oEmail').value.trim(), $('#oPass').value); await start(r.user); }
  catch(err){ $('#gateErr').textContent = authErr(err); }
};

(async () => {
  try{ const u = await currentUser(); if(u) await start(u); }
  catch(e){ $('#gateErr').textContent = e.message; }
})();
setInterval(() => { if(!$('#app').hidden && $('#modal').hidden && $('#zoom').hidden) render(); }, 60000);   // 截止倒數、收單時間到自動鎖

if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(e => console.warn('sw', e));
