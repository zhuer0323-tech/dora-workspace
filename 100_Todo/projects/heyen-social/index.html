<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>禾言社群規劃</title>
<meta name="theme-color" content="#FFF5F7">
<style>
:root{
  --bg:#FFF5F7; --card:#FFFFFF;
  --pink:#F48FB1; --pink-d:#E57399; --pink-l:#FFD9E3; --pink-xl:#FFF0F4;
  --ink:#5B3C46; --ink2:#8C6B76; --ink3:#B79AA4;
  --line:#F6DCE4;
  --know:#7FB6E0; --ai:#9C8FD8; --how:#6FC79A; --fest:#FFB86B;
  --shadow:0 2px 10px rgba(232,150,178,.13);
  --shadow-l:0 6px 22px rgba(232,150,178,.20);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
button,input,textarea,select{font:inherit;color:inherit;border:none;background:none;outline:none}
button{cursor:pointer}
body{
  font-family:"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
  padding:14px 14px 60px; max-width:1240px; margin:0 auto;
  -webkit-text-size-adjust:100%;
}

/* ---------- 登入閘門 ---------- */
#gate{position:fixed;inset:0;background:var(--bg);z-index:99;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#gate h1{font-size:19px}
#gate p{margin:0;font-size:13px;color:var(--ink2);max-width:320px;line-height:1.8}
#gate button{padding:13px 26px;border-radius:14px;background:var(--pink);color:#fff;font-weight:700;
  box-shadow:var(--shadow-l)}
#gate .err{color:#E05263;font-size:12.5px}

/* ---------- 頁首 ---------- */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
header.top h1{font-size:19px;letter-spacing:.5px}
header.top .sub{font-size:12px;color:var(--ink3);margin-left:2px;font-weight:400}
.syncbox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);
  background:#fff;padding:6px 11px;border-radius:99px;box-shadow:var(--shadow)}
.dot{width:7px;height:7px;border-radius:99px;background:var(--ink3)}
.dot.ok{background:#6FC79A}.dot.err{background:#E05263}.dot.wait{background:#FFD97D}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.monthnav{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;
  padding:4px 6px;box-shadow:var(--shadow)}
.monthnav button{width:28px;height:28px;border-radius:99px;color:var(--ink3);font-size:16px}
.monthnav button:hover{background:var(--pink-xl);color:var(--pink-d)}
.monthnav span{font-size:14px;font-weight:700;padding:0 6px;min-width:92px;text-align:center}
.seg{display:flex;background:#fff;border-radius:99px;padding:3px;box-shadow:var(--shadow)}
.seg button{padding:6px 15px;border-radius:99px;font-size:13px;font-weight:700;color:var(--ink3)}
.seg button.on{background:var(--pink);color:#fff}
.addbtn{margin-left:auto;padding:8px 16px;border-radius:99px;background:var(--pink);color:#fff;
  font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.stat{font-size:12px;color:var(--ink3);background:#fff;padding:6px 12px;border-radius:99px;box-shadow:var(--shadow)}

/* ---------- 類型色 ---------- */
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.t-廣告知識{background:var(--know)} .t-AI趨勢{background:var(--ai)}
.t-操作方法{background:var(--how)}  .t-節慶{background:var(--fest)}
.t-其他{background:var(--ink3)}

/* ---------- 月曆 ---------- */
.calwrap{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(88px,1fr));gap:6px;min-width:660px}
.cal .wd{text-align:center;font-size:11.5px;color:var(--ink3);font-weight:700;padding-bottom:4px}
.cal .day{min-height:82px;border-radius:12px;background:var(--pink-xl);padding:6px;
  display:flex;flex-direction:column;gap:4px}
.cal .day.blank{background:transparent}
.cal .day .n{font-size:11.5px;color:var(--ink3);font-weight:700}
.cal .day.today{outline:2px solid var(--pink);outline-offset:-2px}
.cal .ev{background:#fff;border-radius:9px;padding:5px 6px;font-size:11.5px;line-height:1.45;
  cursor:pointer;box-shadow:var(--shadow);border-left:3px solid var(--ink3);text-align:left;width:100%}
.cal .ev:hover{box-shadow:var(--shadow-l)}
.cal .ev.done{opacity:.5}
.cal .ev.done .t{text-decoration:line-through}
.ev.c-廣告知識{border-left-color:var(--know)} .ev.c-AI趨勢{border-left-color:var(--ai)}
.ev.c-操作方法{border-left-color:var(--how)}  .ev.c-節慶{border-left-color:var(--fest)}
.ev.c-其他{border-left-color:var(--ink3)}

/* ---------- 卡片 ---------- */
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.pc{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;
  cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:.15s;text-align:left;width:100%}
.pc:hover{box-shadow:var(--shadow-l);transform:translateY(-1px)}
.pc .hd{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pc .dt{font-size:12px;color:var(--ink3);font-weight:700}
.pc h3{font-size:15px;line-height:1.5;font-weight:700}
.pc .goal{font-size:12px;color:var(--ink3)}
.pc .prev{font-size:12.5px;color:var(--ink2);line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.pc.done{opacity:.62}
.pc.done h3{text-decoration:line-through}
.flag{font-size:11px;color:#6FC79A;font-weight:700}
.empty{color:var(--ink3);font-size:13px;text-align:center;padding:34px 0;line-height:1.9}

/* ---------- 編輯視窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(91,60,70,.35);z-index:50;display:none;
  align-items:flex-start;justify-content:center;padding:18px;overflow-y:auto}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-l);
  width:100%;max-width:620px;padding:18px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal label{font-size:12px;color:var(--ink3);font-weight:700;display:block;margin-bottom:4px}
.modal input[type=date],.modal select,.modal input[type=text]{
  background:var(--pink-xl);border-radius:11px;padding:9px 11px;font-size:14px;width:100%}
.modal textarea{background:var(--pink-xl);border-radius:12px;padding:12px;font-size:13.5px;
  line-height:1.85;width:100%;min-height:210px;resize:vertical;white-space:pre-wrap;font-family:inherit}
.modal textarea.fb{min-height:130px}
.fieldhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.copy{font-size:12px;font-weight:700;color:var(--pink-d);padding:4px 10px;border-radius:99px;background:var(--pink-xl)}
.copy.ok{background:#6FC79A;color:#fff}
.modal .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px}
.btn{padding:10px 18px;border-radius:12px;font-size:14px;font-weight:700}
.btn.p{background:var(--pink);color:#fff;box-shadow:var(--shadow)}
.btn.g{background:var(--pink-xl);color:var(--ink2)}
.btn.d{color:#E05263;margin-left:auto;font-size:13px}
.togg{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.togg i{width:18px;height:18px;border-radius:6px;background:var(--pink-xl);display:inline-block;
  position:relative;transition:.15s}
.togg.on i{background:#6FC79A}
.togg.on i::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
  border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.7}
</style>
</head>

/* ---------- 狀態 ---------- */
let posts = {};              // { id: {date,type,title,goal,ig,fb,done} }
let cur = { y:2026, m:9 };   // 目前看的月份
let view = 'cal';
let editId = null;
let _db=null,_ref=null,_set=null,_remove=null,_ready=false;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const todayStr = () => { const t=new Date(); return ymd(t.getFullYear(), t.getMonth()+1, t.getDate()); };

/* ---------- 存取 ---------- */
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(posts)); }catch(e){} }
function loadLocal(){ try{ posts = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }catch(e){ posts = {}; } }
function push(){
  saveLocal();
  if(!_ready) return;
  _set(_ref(_db, `${ROOM}/posts`), posts).catch(e => { console.warn(e); setSync('err', e.message); });
}
function setSync(state, msg){
  const dot = $('#dot'), txt = $('#syncTxt');
  dot.className = 'dot ' + (state==='ok'?'ok':state==='err'?'err':'wait');
  txt.textContent = state==='ok' ? '雲端已同步' : state==='err' ? (msg||'連線失敗') : '連線中…';
}

/* ---------- 畫面 ---------- */
function monthPosts(){
  const pre = `${cur.y}-${pad(cur.m)}`;
  return Object.entries(posts)
    .filter(([,p]) => (p.date||'').startsWith(pre))
    .sort((a,b) => (a[1].date||'').localeCompare(b[1].date||''));
}

function renderStat(){
  const list = monthPosts();
  const done = list.filter(([,p]) => p.done).length;
  $('#stat').textContent = list.length ? `共 ${list.length} 篇・已發布 ${done} 篇` : '這個月還沒有內容';
  $('#mLabel').textContent = `${cur.y} 年 ${cur.m} 月`;
}

function renderCal(){
  const box = $('#cal');
  const first = new Date(cur.y, cur.m-1, 1).getDay();
  const days = new Date(cur.y, cur.m, 0).getDate();
  const byDay = {};
  monthPosts().forEach(([id,p]) => { (byDay[+p.date.slice(8,10)] ||= []).push([id,p]); });

  let h = ['日','一','二','三','四','五','六'].map(w => `<div class="wd">${w}</div>`).join('');
  for(let i=0;i<first;i++) h += '<div class="day blank"></div>';
  for(let d=1;d<=days;d++){
    const isToday = ymd(cur.y,cur.m,d) === todayStr();
    const evs = (byDay[d]||[]).map(([id,p]) =>
      `<button class="ev c-${esc(p.type||'其他')} ${p.done?'done':''}" data-open="${id}">
         <span class="t">${esc(p.title||'（未命名）')}</span></button>`).join('');
    h += `<div class="day ${isToday?'today':''}"><div class="n">${d}</div>${evs}</div>`;
  }
  box.innerHTML = h;
}

function renderList(){
  const box = $('#viewList'), list = monthPosts();
  if(!list.length){
    box.innerHTML = `<div class="empty" style="grid-column:1/-1">這個月還沒有內容<br>按右上角「＋ 新增貼文」開始排</div>`;
    return;
  }
  box.innerHTML = list.map(([id,p]) => {
    const dt = new Date(p.date+'T00:00:00');
    const wd = ['日','一','二','三','四','五','六'][dt.getDay()];
    return `<button class="pc ${p.done?'done':''}" data-open="${id}">
      <div class="hd">
        <span class="dt">${+p.date.slice(5,7)}/${+p.date.slice(8,10)}（${wd}）</span>
        <span class="chip t-${esc(p.type||'其他')}">${esc(p.type||'其他')}</span>
        ${p.done?'<span class="flag">✓ 已發布</span>':''}
      </div>
      <h3>${esc(p.title||'（未命名）')}</h3>
      ${p.goal?`<div class="goal">目的：${esc(p.goal)}</div>`:''}
      <div class="prev">${esc((p.ig||'').slice(0,120))}</div>
    </button>`;
  }).join('');
}

function renderAll(){ renderStat(); view==='cal' ? renderCal() : renderList(); }

/* ---------- 編輯視窗 ---------- */
function openEdit(id){
  editId = id;
  const p = posts[id] || {};
  $('#fDate').value = p.date || ymd(cur.y,cur.m,1);
  $('#fType').value = p.type || '廣告知識';
  $('#fTitle').value = p.title || '';
  $('#fGoal').value = p.goal || '';
  $('#fIg').value = p.ig || '';
  $('#fFb').value = p.fb || '';
  $('#fDone').classList.toggle('on', !!p.done);
  $('#delBtn').style.display = posts[id] ? '' : 'none';
  $('#mask').classList.add('on');
}
function closeEdit(){ $('#mask').classList.remove('on'); editId = null; }

$('#saveBtn').onclick = () => {
  if(!editId) return;
  posts[editId] = {
    date : $('#fDate').value || ymd(cur.y,cur.m,1),
    type : $('#fType').value,
    title: $('#fTitle').value.trim(),
    goal : $('#fGoal').value.trim(),
    ig   : $('#fIg').value,
    fb   : $('#fFb').value,
    done : $('#fDone').classList.contains('on')
  };
  const d = posts[editId].date;
  cur = { y:+d.slice(0,4), m:+d.slice(5,7) };   // 存到別的月份就跟著跳過去
  push(); closeEdit(); renderAll();
};
$('#delBtn').onclick = () => {
  if(!editId || !posts[editId]) return;
  if(!confirm('確定刪掉這篇？刪了就救不回來了。')) return;
  delete posts[editId]; push(); closeEdit(); renderAll();
};
$('#closeBtn').onclick = closeEdit;
$('#mask').onclick = closeEdit;
$('#fDone').onclick = () => $('#fDone').classList.toggle('on');

$$('.copy').forEach(b => b.onclick = async () => {
  const txt = b.dataset.copy === 'ig' ? $('#fIg').value : $('#fFb').value;
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const t=$( b.dataset.copy==='ig'?'#fIg':'#fFb'); t.select(); document.execCommand('copy'); }
  b.textContent = '已複製'; b.classList.add('ok');
  setTimeout(() => { b.textContent = '複製'; b.classList.remove('ok'); }, 1400);
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-open]');
  if(t) openEdit(t.dataset.open);
});

/* ---------- 工具列 ---------- */
$('#prevM').onclick = () => { cur.m--; if(cur.m<1){cur.m=12;cur.y--;} renderAll(); };
$('#nextM').onclick = () => { cur.m++; if(cur.m>12){cur.m=1;cur.y++;} renderAll(); };
$('#addBtn').onclick = () => {
  // 先不要寫進 posts，不然按取消會留下一筆空白貼文；按儲存才真的存進去
  openEdit(uid());
};
$$('.seg button').forEach(b => b.onclick = () => {
  $$('.seg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  view = b.dataset.view;
  $('#viewCal').style.display  = view==='cal'  ? '' : 'none';
  $('#viewList').style.display = view==='list' ? '' : 'none';
  renderAll();
});

/* ---------- Firebase ---------- */
async function initFirebase(interactive){
  setSync('wait');
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } =
    await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const { getDatabase, ref, set, get, remove, onValue } =
    await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);

  let user = await new Promise(res => { const un = onAuthStateChanged(auth, u => { un(); res(u); }); });
  if(!user){
    if(!interactive) return false;
    user = (await signInWithPopup(auth, new GoogleAuthProvider())).user;
  }
  if(user.email !== OWNER_EMAIL){
    await signOut(auth);
    throw new Error(`這個帳號（${user.email}）沒有權限，請用 ${OWNER_EMAIL} 登入`);
  }

  _db = getDatabase(app); _ref = ref; _set = set; _remove = remove;
  const snap = await get(ref(_db, `${ROOM}/posts`));
  const cloud = snap.exists() ? snap.val() : null;
  _ready = true; setSync('ok');

  if(cloud && Object.keys(cloud).length){
    posts = cloud;
  }else{
    // 雲端還是空的 → 把九月那批種進去（只會發生一次）
    if(!Object.keys(posts).length) seed();
    push();
  }
  saveLocal(); renderAll();

  onValue(ref(_db, `${ROOM}/posts`), s => {
    const v = s.exists() ? s.val() : {};
    if(JSON.stringify(v) === JSON.stringify(posts)) return;
    posts = v; saveLocal(); renderAll();
  });
  return true;
}

function seed(){
  SEED.forEach(s => {
    posts[uid()] = { date:s.d, type:s.t, title:s.ti, goal:s.g, ig:s.ig, fb:s.fb, done:false };
  });
}

/* ---------- 啟動 ---------- */
loadLocal();
renderAll();

$('#gateBtn').onclick = async () => {
  $('#gateErr').textContent = '';
  try{
    await initFirebase(true);
    $('#gate').style.display = 'none';
  }catch(e){
    $('#gateErr').textContent = e.message || '登入失敗，再試一次';
    setSync('err', e.message);
  }
};

(async () => {
  try{
    const ok = await initFirebase(false);   // 已經登入過就直接進去
    if(ok) $('#gate').style.display = 'none';
    else setSync('wait');
  }catch(e){ setSync('err', e.message); }
})();
</script>
