<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>禾言社群規劃</title>
<meta name="theme-color" content="#FFF5F7">
<style>
:root{
  --bg:#FFF5F7; --card:#FFFFFF;
  --pink:#F48FB1; --pink-d:#E57399; --pink-l:#FFD9E3; --pink-xl:#FFF0F4;
  --ink:#5B3C46; --ink2:#8C6B76; --ink3:#B79AA4;
  --line:#F6DCE4;
  --view:#9C8FD8; --teach:#7FB6E0; --life:#FFB86B; --coach:#6FC79A;
  --shadow:0 2px 10px rgba(232,150,178,.13);
  --shadow-l:0 6px 22px rgba(232,150,178,.20);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
button,input,textarea,select{font:inherit;color:inherit;border:none;background:none;outline:none}
button{cursor:pointer}
body{
  font-family:"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
  padding:14px 14px 60px; max-width:1240px; margin:0 auto;
  -webkit-text-size-adjust:100%;
}

/* ---------- 登入閘門 ---------- */
#gate{position:fixed;inset:0;background:var(--bg);z-index:99;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#gate h1{font-size:19px}
#gate p{margin:0;font-size:13px;color:var(--ink2);max-width:320px;line-height:1.8}
#gate button{padding:13px 26px;border-radius:14px;background:var(--pink);color:#fff;font-weight:700;
  box-shadow:var(--shadow-l)}
#gate .err{color:#E05263;font-size:12.5px}

/* ---------- 頁首 ---------- */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
header.top h1{font-size:19px;letter-spacing:.5px}
header.top .sub{font-size:12px;color:var(--ink3);margin-left:2px;font-weight:400}
.syncbox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);
  background:#fff;padding:6px 11px;border-radius:99px;box-shadow:var(--shadow)}
.dot{width:7px;height:7px;border-radius:99px;background:var(--ink3)}
.dot.ok{background:#6FC79A}.dot.err{background:#E05263}.dot.wait{background:#FFD97D}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.monthnav{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;
  padding:4px 6px;box-shadow:var(--shadow)}
.monthnav button{width:28px;height:28px;border-radius:99px;color:var(--ink3);font-size:16px}
.monthnav button:hover{background:var(--pink-xl);color:var(--pink-d)}
.monthnav span{font-size:14px;font-weight:700;padding:0 6px;min-width:92px;text-align:center}
.seg{display:flex;background:#fff;border-radius:99px;padding:3px;box-shadow:var(--shadow)}
.seg button{padding:6px 15px;border-radius:99px;font-size:13px;font-weight:700;color:var(--ink3)}
.seg button.on{background:var(--pink);color:#fff}
.addbtn{margin-left:auto;padding:8px 16px;border-radius:99px;background:var(--pink);color:#fff;
  font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.stat{font-size:12px;color:var(--ink3);background:#fff;padding:6px 12px;border-radius:99px;box-shadow:var(--shadow)}

/* ---------- 類型色 ---------- */
/* class 名用英文 slug，因為類型名稱裡有斜線，直接當 class 選擇器要跳脫 */
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.t-view{background:var(--view)}  .t-teach{background:var(--teach)}
.t-life{background:var(--life)}  .t-coach{background:var(--coach)}
.t-etc{background:var(--ink3)}

/* ---------- 月曆 ---------- */
.calwrap{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(88px,1fr));gap:6px;min-width:660px}
.cal .wd{text-align:center;font-size:11.5px;color:var(--ink3);font-weight:700;padding-bottom:4px}
.cal .day{min-height:82px;border-radius:12px;background:var(--pink-xl);padding:6px;
  display:flex;flex-direction:column;gap:4px}
.cal .day.blank{background:transparent}
.cal .day .n{font-size:11.5px;color:var(--ink3);font-weight:700}
.cal .day.today{outline:2px solid var(--pink);outline-offset:-2px}
.cal .ev{background:#fff;border-radius:9px;padding:5px 6px;font-size:11.5px;line-height:1.45;
  cursor:grab;box-shadow:var(--shadow);border-left:3px solid var(--ink3);text-align:left;width:100%;
  display:flex;align-items:flex-start;gap:4px}
.cal .ev:active{cursor:grabbing}
.cal .ev:hover{box-shadow:var(--shadow-l)}
.cal .ev .t{flex:1;cursor:text}
.cal .ev .evopen{color:var(--ink3);font-size:13px;line-height:1;padding:0 2px;opacity:0;flex:none}
.cal .ev:hover .evopen{opacity:1}
.cal .ev.done{opacity:.5}
.cal .ev.done .t{text-decoration:line-through}
.ev.c-view{border-left-color:var(--view)}  .ev.c-teach{border-left-color:var(--teach)}
.ev.c-life{border-left-color:var(--life)}  .ev.c-coach{border-left-color:var(--coach)}
.ev.c-etc{border-left-color:var(--ink3)}

/* ---------- 卡片 ---------- */
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.pc{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;
  cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:.15s;text-align:left;width:100%}
.pc:hover{box-shadow:var(--shadow-l);transform:translateY(-1px)}
.pc .hd{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pc .dt{font-size:12px;color:var(--ink3);font-weight:700}
.pc h3{font-size:15px;line-height:1.5;font-weight:700}
.pc .goal{font-size:12px;color:var(--ink3)}
.pc .prev{font-size:12.5px;color:var(--ink2);line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.pc.done{opacity:.62}
.pc.done h3{text-decoration:line-through}
.flag{font-size:11px;color:#6FC79A;font-weight:700}
.empty{color:var(--ink3);font-size:13px;text-align:center;padding:34px 0;line-height:1.9}

/* ---------- 圖文表（照她 Google 試算表的形式：一篇一欄，左邊固定欄位名） ---------- */
.sheetwrap{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:0;overflow:auto;max-height:78vh;
  width:max-content;max-width:100%}   /* 只有一兩篇時，白底不要拖出一大片空白 */
.sheet{border-collapse:separate;border-spacing:0;font-size:12.5px;line-height:1.65}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:8px 10px;vertical-align:top;text-align:left}
/* 左邊那排欄位名固定住，橫向捲動時不會跑掉 */
.sheet th.rowhd{position:sticky;left:0;z-index:2;background:var(--pink-xl);
  font-weight:700;color:var(--ink2);width:96px;min-width:96px;font-size:12px;text-align:center}
.sheet tr.dark th.rowhd{background:var(--ink);color:#fff}
.sheet tr.tint th.rowhd{background:var(--pink-l)}
.sheet td{min-width:270px;max-width:340px;background:#fff}
.sheet td.on{background:var(--pink-xl)}
.sheet .code{font-weight:700;font-size:14px;text-align:center;letter-spacing:.5px}
.sheet .copytxt{white-space:pre-wrap;max-height:340px;overflow-y:auto;
  background:var(--pink-xl);border-radius:10px;padding:9px}
.sheet .imgbox{height:150px;border:1.5px dashed var(--line);border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:11.5px}
.sheet .imgbox img{max-width:100%;max-height:150px;border-radius:10px;object-fit:contain}
.sheet .none{color:var(--ink3)}
.sheet td.editable{cursor:text}
.sheet td.editable:hover{outline:1.5px solid var(--pink-l);outline-offset:-2px}
.sheet .code[draggable]{cursor:grab}
.sheet .code[draggable]:active{cursor:grabbing}

/* 就地編輯用的輸入框（表格與月曆共用） */
.cellinput{width:100%;background:#fff;border:1.5px solid var(--pink);border-radius:8px;
  padding:6px 8px;font-size:12.5px;line-height:1.6;font-family:inherit}
.cellinput.area{min-height:200px;white-space:pre-wrap;resize:vertical}
td.editing{background:#fff !important}

/* 拖曳時目標會亮起來 */
.dropok{outline:2px dashed var(--pink) !important;outline-offset:-2px}
.cal .day.dropok{background:var(--pink-l)}
.sheet .rowact{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sheet .mini{font-size:11.5px;font-weight:700;color:var(--pink-d);
  padding:3px 9px;border-radius:99px;background:var(--pink-xl)}
.sheet .mini.ok{background:#6FC79A;color:#fff}
.sheet a{word-break:break-all}

/* ---------- 編輯視窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(91,60,70,.35);z-index:50;display:none;
  align-items:flex-start;justify-content:center;padding:18px;overflow-y:auto}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-l);
  width:100%;max-width:620px;padding:18px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal label{font-size:12px;color:var(--ink3);font-weight:700;display:block;margin-bottom:4px}
.modal input[type=date],.modal select,.modal input[type=text]{
  background:var(--pink-xl);border-radius:11px;padding:9px 11px;font-size:14px;width:100%}
.modal textarea{background:var(--pink-xl);border-radius:12px;padding:12px;font-size:13.5px;
  line-height:1.85;width:100%;min-height:210px;resize:vertical;white-space:pre-wrap;font-family:inherit}
.modal textarea.fb{min-height:130px}
.fieldhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.copy{font-size:12px;font-weight:700;color:var(--pink-d);padding:4px 10px;border-radius:99px;background:var(--pink-xl)}
.copy.ok{background:#6FC79A;color:#fff}
.modal .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px}
.btn{padding:10px 18px;border-radius:12px;font-size:14px;font-weight:700}
.btn.p{background:var(--pink);color:#fff;box-shadow:var(--shadow)}
.btn.g{background:var(--pink-xl);color:var(--ink2)}
.btn.d{color:#E05263;margin-left:auto;font-size:13px}
.togg{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.togg i{width:18px;height:18px;border-radius:6px;background:var(--pink-xl);display:inline-block;
  position:relative;transition:.15s}
.togg.on i{background:#6FC79A}
.togg.on i::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
  border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.7}
.more summary{font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;
  background:var(--pink-xl);padding:9px 12px;border-radius:11px;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"▸ ";color:var(--ink3)}
.more[open] summary::before{content:"▾ "}
.morebox{display:flex;flex-direction:column;gap:10px;padding:12px 2px 2px}
.modal textarea.short{min-height:80px}
</style>
</head>
<body>

<div id="gate">
  <h1>禾言社群規劃</h1>
  <p>這裡有客戶與案例資訊，請用朱兒的 Google 帳號登入才看得到內容。</p>
  <button id="gateBtn">用 Google 登入</button>
  <div class="err" id="gateErr"></div>
</div>

<header class="top">
  <h1>禾言社群規劃 <span class="sub">貼文議題與文案看板</span></h1>
  <div class="syncbox"><span class="dot" id="dot"></span><span id="syncTxt">連線中…</span></div>
</header>

<div class="bar">
  <div class="monthnav">
    <button id="prevM">‹</button><span id="mLabel">2026 年 9 月</span><button id="nextM">›</button>
  </div>
  <div class="seg">
    <button data-view="cal" class="on">月曆</button>
    <button data-view="list">卡片</button>
    <button data-view="sheet">圖文表</button>
  </div>
  <span class="stat" id="stat"></span>
  <button class="addbtn" id="addBtn">＋ 新增貼文</button>
</div>

<div id="viewCal" class="calwrap"><div class="cal" id="cal"></div></div>
<div id="viewList" class="grid" style="display:none"></div>
<div id="viewSheet" class="sheetwrap" style="display:none"><table class="sheet" id="sheet"></table></div>

<div class="mask" id="mask">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="row">
      <div style="flex:1;min-width:150px">
        <label>發布日期</label><input type="date" id="fDate">
      </div>
      <div style="flex:1;min-width:130px">
        <label>內容類型</label>
        <select id="fType">
          <option>觀點/趨勢</option><option>教學/新手</option>
          <option>日常/節慶</option><option>廣告顧問陪跑</option><option>其他</option>
        </select>
      </div>
    </div>
    <div><label>議題標題</label><input type="text" id="fTitle" placeholder="這篇要講什麼"></div>
    <div><label>這篇的目的</label><input type="text" id="fGoal" placeholder="專業形象 / 帶詢價 / 品牌好感"></div>
    <div>
      <div class="fieldhd"><label style="margin:0">貼文文案</label>
        <button class="copy" data-copy="ig">複製</button></div>
      <textarea id="fIg"></textarea>
    </div>
    <details class="more">
      <summary>圖文表的其他欄位（素材編號、素材圖、貼文連結…）</summary>
      <div class="morebox">
        <div class="row">
          <div style="flex:1;min-width:130px"><label>素材編號</label>
            <input type="text" id="fCode" placeholder="例如 HB01"></div>
          <div style="flex:1;min-width:130px"><label>文案編號</label>
            <input type="text" id="fCopyCode" placeholder="例如 C01"></div>
        </div>
        <div><label>素材名稱</label><input type="text" id="fName"></div>
        <div class="row">
          <div style="flex:1;min-width:130px"><label>素材類型</label>
            <input type="text" id="fMedia" placeholder="圖文 / 影片 / 輪播"></div>
          <div style="flex:1;min-width:130px"><label>廣告格式</label>
            <input type="text" id="fFormat" placeholder="貼文 / 限動 / Reels"></div>
        </div>
        <div><label>標題</label><input type="text" id="fHeadline"></div>
        <div><label>素材圖網址</label><input type="text" id="fImage" placeholder="貼圖片網址，圖文表會顯示縮圖"></div>
        <div><label>貼文連結</label><input type="text" id="fLink" placeholder="發布後把連結貼回來"></div>
        <div><label>歡迎語 / 常見問題</label><textarea id="fFaq" class="short"></textarea></div>
        <button class="togg" id="fStar"><i></i>⭐ 成效佳</button>
      </div>
    </details>
    <div class="foot">
      <button class="togg" id="fDone"><i></i>已發布</button>
      <button class="btn p" id="saveBtn">儲存</button>
      <button class="btn g" id="closeBtn">取消</button>
      <button class="btn d" id="delBtn">刪除這篇</button>
    </div>
    <div class="hint">改完記得按儲存。內容會同步到雲端，換手機打開也看得到。</div>
  </div>
</div>

<script type="module">
/* 禾言社群規劃看板
   資料放在工作台同一個 Firebase 專案，但獨立節點，規則一樣綁朱兒的 Google 帳號。
   沒登入 = 讀不到任何一筆（貼文裡有客戶名稱與案例數據）。 */
const OWNER_EMAIL = 'zhuer0323@gmail.com';
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAWOXPFBmb-lU90dpBOq2B8Gn7LsR2p-jM",
  authDomain: "busan-trip-2026-201f8.firebaseapp.com",
  databaseURL: "https://busan-trip-2026-201f8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "busan-trip-2026-201f8",
  storageBucket: "busan-trip-2026-201f8.firebasestorage.app",
  messagingSenderId: "300878890409",
  appId: "1:300878890409:web:c80543dc5c43f6d81bb0b8"
};
const ROOM = 'hy_social_r7n3k8';   // 改名要同步改 Firebase 規則
const LS_KEY = 'hy_social_posts';

/* 內容類型（2026-08-13 改成這四類 ＋ 其他）
   class 選擇器用英文 slug，因為名稱裡有斜線 */
const SLUG = {
  '觀點/趨勢':'view', '教學/新手':'teach',
  '日常/節慶':'life', '廣告顧問陪跑':'coach', '其他':'etc'
};
const slugOf = t => SLUG[t] || 'etc';

/* 舊類型自動搬到新類型，照 typesVersion 分版跑，每版只跑一次。
   跑過就記在雲端的 meta，之後她自己改類型才不會又被搬回去。 */
const TYPES_VERSION = 2;
const OLD_TYPE_MAP = {
  '廣告知識':'教學/新手', 'AI趨勢':'觀點/趨勢',
  '操作方法':'教學/新手', '節慶':'日常/節慶'
};
// 這篇結尾帶到五大服務，歸「廣告顧問陪跑」比通用對應準
const V2_BY_DATE = { '2026-09-29':'廣告顧問陪跑' };

/* 文案版本：程式碼裡的 SEED 改過之後，用它把雲端同一天的文案補上去。
   一樣只跑一次，之後她在網頁上改的文案就不會被蓋掉。
   v2＝2026-08-13 每篇結尾加上【禾言觀點】與行動呼籲。 */
const CONTENT_VERSION = 2;
function migrateContent(ver){
  if(ver >= CONTENT_VERSION) return false;
  const byDate = {};
  SEED.forEach(s => byDate[s.d] = s);
  let changed = false;
  Object.values(posts).forEach(p => {
    const s = byDate[p.date];
    if(s && s.ig && p.ig !== s.ig){ p.ig = s.ig; changed = true; }
  });
  return changed;
}

function migrateTypes(ver){
  if(ver >= TYPES_VERSION) return false;
  let changed = false;
  Object.values(posts).forEach(p => {
    const byDate = V2_BY_DATE[p.date];
    if(byDate){ if(p.type !== byDate){ p.type = byDate; changed = true; } return; }
    const mapped = OLD_TYPE_MAP[p.type];
    if(mapped){ p.type = mapped; changed = true; }
  });
  return changed;
}

/* ---------- 種子內容（雲端第一次是空的才寫進去） ----------
   八月那三篇是從朱兒的 Google 試算表「禾言社群規劃」搬過來的既有內容，
   日期照「2026.8月規劃」分頁排的，文案照「2026.8月圖文」分頁。 */
const SEED = [
{d:'2026-08-13',t:'教學/新手',g:'專業形象',code:'HA01',ti:'Meta 廣告到底怎麼選？',
ig:`Meta 廣告這麼多種，到底要選哪一個？

📢老闆們
先將你的目標定好，再來進行廣告投放

→ 互動廣告
🌟想把人導進網站
→ 流量廣告

🌟想讓客戶直接問問題
→ 訊息廣告
🌟想蒐集電話、Email
→ 名單廣告
🌟想直接創造購買
→ 銷售廣告

你不知道該怎麼設定目標嗎？
立即私訊禾言小編，讓專員為您解答唷！

#禾言 #禾言數位 #禾言數位行銷
#廣告顧問陪跑 #廣告投放`},

{d:'2026-08-19',t:'教學/新手',g:'專業形象',code:'HA02',ti:'訊息廣告不是「有人問」就好',
ig:`「訊息很多，為什麼還是沒成交？」

訊息廣告其實有 3 關：
第一關｜讓他願意點進來

1. 內容結構化：多用清單、表格、標題層級，AI 爬取非常依賴這些標記

let _db=null,_ref=null,_set=null,_remove=null,_ready=false;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const todayStr = () => { const t=new Date(); return ymd(t.getFullYear(), t.getMonth()+1, t.getDate()); };

/* ---------- 存取 ---------- */
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(posts)); }catch(e){} }
function loadLocal(){ try{ posts = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }catch(e){ posts = {}; } }
function push(){
  saveLocal();
  if(!_ready) return;
  _set(_ref(_db, `${ROOM}/posts`), posts).catch(e => { console.warn(e); setSync('err', e.message); });
}
function setSync(state, msg){
  const dot = $('#dot'), txt = $('#syncTxt');
  dot.className = 'dot ' + (state==='ok'?'ok':state==='err'?'err':'wait');
  txt.textContent = state==='ok' ? '雲端已同步' : state==='err' ? (msg||'連線失敗') : '連線中…';
}

/* ---------- 畫面 ---------- */
function monthPosts(){
  const pre = `${cur.y}-${pad(cur.m)}`;
  // 有自己拖過順序（ord）的排前面，沒拖過的照日期
  return Object.entries(posts)
    .filter(([,p]) => (p.date||'').startsWith(pre))
    .sort((a,b) => {
      const oa = a[1].ord ?? 9999, ob = b[1].ord ?? 9999;
      if(oa !== ob) return oa - ob;
      return (a[1].date||'').localeCompare(b[1].date||'');
    });
}

/* 把目前這個月的順序重新編號，拖完就叫一次 */
function renumber(list){
  list.forEach(([id], i) => { if(posts[id]) posts[id].ord = i; });
}

function renderStat(){
  const list = monthPosts();
  const done = list.filter(([,p]) => p.done).length;
  $('#stat').textContent = list.length ? `共 ${list.length} 篇・已發布 ${done} 篇` : '這個月還沒有內容';

}

/* 圖文表：照朱兒 Google 試算表「禾言社群規劃」的圖文模板排的，
   一篇貼文一欄，左邊 13 個欄位名固定住。深色底那幾列跟她表單一致。 */
const SHEET_ROWS = [
  { k:'code',  n:'素材編號<br>(⭐ 成效佳)', cls:'dark' },
  { k:'name',  n:'素材名稱' },
  { k:'type',  n:'貼文類型', cls:'tint' },
  { k:'title', n:'貼文主題' },
  { k:'media', n:'素材類型' },
  { k:'date',  n:'上線時間', cls:'dark' },
  { k:'link',  n:'貼文連結', cls:'dark' },
  { k:'image', n:'素材圖' },
  { k:'format',n:'廣告格式' },
  { k:'copyCode', n:'文案編號' },
  { k:'copy',  n:'文案' },
  { k:'headline', n:'標題' },
  { k:'faq',   n:'歡迎語/<br>常見問題' }
];

function sheetCell(k, id, p){
  const none = '<span class="none">點一下填寫</span>';
  switch(k){
    case 'code':
      // 這格同時是拖曳把手，拖它就能換整欄的位置
      return `<div class="code" draggable="true" data-drag="${id}" title="按住可以拖到別的位置">
                ${p.star?'⭐ ':''}${esc(p.code) || '<span class="none">—</span>'}</div>`;
    case 'type':
      return `<span class="chip t-etc" style="background:var(--ink3)">社群(前台)</span>
              <span class="chip t-${slugOf(p.type)}" style="margin-left:4px">${esc(p.type||'其他')}</span>`;
    case 'title':
      return `<div>${esc(p.title) || none}</div>`;
    case 'date': {
      if(!p.date) return none;
      const wd = ['日','一','二','三','四','五','六'][new Date(p.date+'T00:00:00').getDay()];
      return `${p.date}（${wd}）${p.done ? '<br><span style="color:#6FC79A;font-weight:700">✓ 已發布</span>' : ''}`;
    }
    case 'link':
      return p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.link)}</a>` : none;
    case 'image':
      return p.image
        ? `<div class="imgbox"><img src="${esc(p.image)}" alt=""></div>`
        : `<div class="imgbox">還沒放素材圖</div>`;
    case 'copy':
      return `<div class="copytxt">${esc(p.copyText) || '點一下開始寫'}</div>
              <div class="rowact">
                <button class="mini" data-copytext="${id}">複製文案</button>
                <button class="mini" data-open="${id}">開整篇編輯</button>
              </div>`;
    default:
      return esc(p[k]) || none;
  }
}

/* 哪些欄位可以在表格上直接改，以及要用什麼輸入元件 */
const CELL_EDIT = {
  code:'text', name:'text', type:'select', title:'text', media:'text',
  date:'date', link:'text', image:'text', format:'text', copyCode:'text',
  copy:'textarea', headline:'text', faq:'textarea'
};

function renderSheet(){
  const box = $('#sheet'), list = monthPosts();
  if(!list.length){
    box.innerHTML = `<tr><td class="empty" style="min-width:auto">這個月還沒有內容<br>按右上角「＋ 新增貼文」開始排</td></tr>`;
    return;
  }
  box.innerHTML = SHEET_ROWS.map(r => {
    const tds = list.map(([id,p]) => {
      // 把資料攤平成這一列要的值，文案那欄用 ig（介面上就叫「貼文文案」）
      const v = { ...p, copyText: p.ig };
      const canEdit = CELL_EDIT[r.k] ? ` data-cell="${id}|${r.k}"` : '';
      return `<td class="${p.done?'on':''}${canEdit?' editable':''}"${canEdit}>${sheetCell(r.k, id, v)}</td>`;
    }).join('');
    return `<tr class="${r.cls||''}"><th class="rowhd">${r.n}</th>${tds}</tr>`;
  }).join('');
}

function renderAll(){
  if(editingCell) return;        // 正在格子裡打字就先不要重畫，不然字會被洗掉
  renderStat();
  if(view==='cal') renderCal();
  else if(view==='list') renderList();
  else renderSheet();
}

/* ---------- 表格上直接改（點一下就變輸入框，點別處或按 Esc 就存起來） ---------- */
let editingCell = null;

function openCellEdit(td){
  if(editingCell) return;
  const [id, key] = td.dataset.cell.split('|');
  const p = posts[id];
  if(!p) return;
  const kind = CELL_EDIT[key];
  const cur  = key === 'copy' ? (p.ig || '') : (p[key] || '');

  let el;
  if(kind === 'textarea'){
    el = document.createElement('textarea');
    el.value = cur;
    el.className = 'cellinput area';
  }else if(kind === 'select'){
    el = document.createElement('select');
    el.className = 'cellinput';
    Object.keys(SLUG).forEach(t => {
      const o = document.createElement('option');
      o.value = o.textContent = t;
      if(t === p.type) o.selected = true;
      el.appendChild(o);
    });
  }else{
    el = document.createElement('input');
    el.type = kind === 'date' ? 'date' : 'text';
    el.value = cur;
    el.className = 'cellinput';
  }

  editingCell = { id, key, td };
  td.innerHTML = '';
  td.appendChild(el);
  td.classList.add('editing');
  el.focus();
  if(el.setSelectionRange && kind !== 'date'){
    const n = el.value.length;
    try{ el.setSelectionRange(n, n); }catch(e){}
  }

  const commit = save => {
    if(!editingCell) return;
    editingCell = null;
    if(save){
      const v = el.value;
      if(key === 'copy') p.ig = v;
      else if(key === 'date'){ if(v) p.date = v; }
      else p[key] = (kind === 'textarea') ? v : v.trim();
      push();
    }
    td.classList.remove('editing');
    renderAll();
  };

  el.addEventListener('blur', () => commit(true));
  el.addEventListener('keydown', ev => {
    if(ev.key === 'Escape'){ ev.preventDefault(); commit(false); }
    // 單行欄位按 Enter 就存；文案是多行，用 Cmd/Ctrl+Enter 存
    if(ev.key === 'Enter' && (kind !== 'textarea' || ev.metaKey || ev.ctrlKey)){
      ev.preventDefault(); el.blur();
    }
  });
  if(kind === 'select') el.addEventListener('change', () => el.blur());
}

/* ---------- 拖曳 ---------- */
let dragId = null;

// 圖文表：拖「素材編號」那格換整欄的位置
function sheetDrop(targetId){
  if(!dragId || dragId === targetId) return;
  const list = monthPosts();
  const ids  = list.map(([id]) => id);
  const from = ids.indexOf(dragId), to = ids.indexOf(targetId);
  if(from < 0 || to < 0) return;
  ids.splice(to, 0, ids.splice(from, 1)[0]);
  ids.forEach((id, i) => { posts[id].ord = i; });
  push(); renderAll();
}

// 月曆：拖到別的日期就改上線時間
function calDrop(dateStr){
  if(!dragId || !posts[dragId]) return;
  if(posts[dragId].date === dateStr) return;
  posts[dragId].date = dateStr;
  push(); renderAll();
}

document.addEventListener('dragstart', e => {
  const h = e.target.closest('[data-drag]');
  if(!h) return;
  dragId = h.dataset.drag;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragId); }catch(err){}
});
document.addEventListener('dragend', () => {
  dragId = null;
  $$('.dropok').forEach(el => el.classList.remove('dropok'));
});
document.addEventListener('dragover', e => {
  const day = e.target.closest('.cal .day:not(.blank)');
  const col = e.target.closest('#sheet td');
  if(!dragId || (!day && !col)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  $$('.dropok').forEach(el => el.classList.remove('dropok'));
  (day || col).classList.add('dropok');
});
document.addEventListener('drop', e => {
  if(!dragId) return;
  const day = e.target.closest('.cal .day:not(.blank)');
  const col = e.target.closest('#sheet td[data-cell]');
  if(day){ e.preventDefault(); calDrop(day.dataset.date); }
  else if(col){ e.preventDefault(); sheetDrop(col.dataset.cell.split('|')[0]); }
  $$('.dropok').forEach(el => el.classList.remove('dropok'));
  dragId = null;
});

/* ---------- 編輯視窗 ---------- */
function openEdit(id){
  editId = id;
  const p = posts[id] || {};
  $('#fDate').value = p.date || ymd(cur.y,cur.m,1);
  $('#fType').value = SLUG[p.type] ? p.type : '教學/新手';
  $('#fTitle').value = p.title || '';
  $('#fGoal').value = p.goal || '';
  $('#fIg').value = p.ig || '';
  $('#fCode').value     = p.code || '';
  $('#fCopyCode').value = p.copyCode || '';
  $('#fName').value     = p.name || '';
  $('#fMedia').value    = p.media || '';
  $('#fFormat').value   = p.format || '';
  $('#fHeadline').value = p.headline || '';
  $('#fImage').value    = p.image || '';
  $('#fLink').value     = p.link || '';
  $('#fFaq').value      = p.faq || '';
  $('#fStar').classList.toggle('on', !!p.star);
  $('#fDone').classList.toggle('on', !!p.done);
  $('#delBtn').style.display = posts[id] ? '' : 'none';
  $('#mask').classList.add('on');
}
function closeEdit(){ $('#mask').classList.remove('on'); editId = null; }

$('#saveBtn').onclick = () => {
  if(!editId) return;
  posts[editId] = {
    date : $('#fDate').value || ymd(cur.y,cur.m,1),
    type : $('#fType').value,
    title: $('#fTitle').value.trim(),
    goal : $('#fGoal').value.trim(),
    ig   : $('#fIg').value,
    // fb 是舊的短版，介面上已經拿掉了，但值先留著不動免得哪天想找回來
    fb   : (posts[editId] && posts[editId].fb) || '',
    done : $('#fDone').classList.contains('on'),
    // 以下是圖文表的欄位
    code     : $('#fCode').value.trim(),
    copyCode : $('#fCopyCode').value.trim(),
    name     : $('#fName').value.trim(),
    media    : $('#fMedia').value.trim(),
    format   : $('#fFormat').value.trim(),
    headline : $('#fHeadline').value.trim(),
    image    : $('#fImage').value.trim(),
    link     : $('#fLink').value.trim(),
    faq      : $('#fFaq').value,
    star     : $('#fStar').classList.contains('on')
  };
  const d = posts[editId].date;
  cur = { y:+d.slice(0,4), m:+d.slice(5,7) };   // 存到別的月份就跟著跳過去
  push(); closeEdit(); renderAll();
};
$('#delBtn').onclick = () => {
  if(!editId || !posts[editId]) return;
  if(!confirm('確定刪掉這篇？刪了就救不回來了。')) return;
  delete posts[editId]; push(); closeEdit(); renderAll();
};
$('#closeBtn').onclick = closeEdit;
$('#mask').onclick = closeEdit;
$('#fDone').onclick = () => $('#fDone').classList.toggle('on');
$('#fStar').onclick = () => $('#fStar').classList.toggle('on');

$$('.copy').forEach(b => b.onclick = async () => {
  const txt = $('#fIg').value;
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ $('#fIg').select(); document.execCommand('copy'); }
  b.textContent = '已複製'; b.classList.add('ok');
  setTimeout(() => { b.textContent = '複製'; b.classList.remove('ok'); }, 1400);
});

document.addEventListener('click', async e => {
  // 圖文表裡直接複製整篇文案，不用先開編輯視窗
  const c = e.target.closest('[data-copytext]');
  if(c){
    const p = posts[c.dataset.copytext];
    if(!p) return;
    try{ await navigator.clipboard.writeText(p.ig || ''); }catch(err){ console.warn(err); }
    c.textContent = '已複製'; c.classList.add('ok');
    setTimeout(() => { c.textContent = '複製文案'; c.classList.remove('ok'); }, 1400);
    return;
  }
  const t = e.target.closest('[data-open]');
  if(t){ openEdit(t.dataset.open); return; }

  // 月曆上點標題就直接改
  const ct = e.target.closest('[data-caltitle]');
  if(ct){ openCalTitleEdit(ct); return; }

  // 圖文表上點格子就直接改
  const cell = e.target.closest('#sheet td[data-cell]');
  if(cell && !cell.classList.contains('editing')) openCellEdit(cell);
});

/* 月曆上就地改標題 */
function openCalTitleEdit(span){
  if(editingCell) return;
  const id = span.dataset.caltitle, p = posts[id];
  if(!p) return;
  const el = document.createElement('input');
  el.type = 'text'; el.value = p.title || ''; el.className = 'cellinput';
  editingCell = { id, key:'title' };
  span.replaceWith(el);
  el.focus(); el.select();

  const commit = save => {
    if(!editingCell) return;
    editingCell = null;
    if(save){ p.title = el.value.trim(); push(); }
    renderAll();
  };
  el.addEventListener('blur', () => commit(true));
  el.addEventListener('keydown', ev => {
    if(ev.key === 'Escape'){ ev.preventDefault(); commit(false); }
    if(ev.key === 'Enter'){ ev.preventDefault(); el.blur(); }
  });
}

/* ---------- 工具列 ---------- */
$('#prevM').onclick = () => { cur.m--; if(cur.m<1){cur.m=12;cur.y--;} renderAll(); };
$('#nextM').onclick = () => { cur.m++; if(cur.m>12){cur.m=1;cur.y++;} renderAll(); };
$('#addBtn').onclick = () => {
  // 先不要寫進 posts，不然按取消會留下一筆空白貼文；按儲存才真的存進去
  openEdit(uid());
};
$$('.seg button').forEach(b => b.onclick = () => {
  $$('.seg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  view = b.dataset.view;
  $('#viewCal').style.display   = view==='cal'   ? '' : 'none';
  $('#viewList').style.display  = view==='list'  ? '' : 'none';
  $('#viewSheet').style.display = view==='sheet' ? '' : 'none';
  renderAll();
});

/* ---------- Firebase ---------- */
async function initFirebase(interactive){
  setSync('wait');
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } =
    await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const { getDatabase, ref, set, get, remove, onValue } =
    await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);

  let user = await new Promise(res => { const un = onAuthStateChanged(auth, u => { un(); res(u); }); });
  if(!user){
    if(!interactive) return false;
    user = (await signInWithPopup(auth, new GoogleAuthProvider())).user;
  }
  if(user.email !== OWNER_EMAIL){
    await signOut(auth);
    throw new Error(`這個帳號（${user.email}）沒有權限，請用 ${OWNER_EMAIL} 登入`);
  }

  _db = getDatabase(app); _ref = ref; _set = set; _remove = remove;
  const snap = await get(ref(_db, ROOM));
  const d = snap.exists() ? snap.val() : {};
  const cloud = d.posts;
  const meta  = d.meta || {};
  const tv = meta.typesVersion   || 1;
  const cv = meta.contentVersion || 1;
  _ready = true; setSync('ok');

  if(cloud && Object.keys(cloud).length){
    posts = cloud;
    // 舊資料的類型搬到新的四類、文案補上新的結尾，各只跑一次
    const a = migrateTypes(tv), b = migrateContent(cv);
    if(a || b) push();
  }else{
    // 雲端還是空的 → 把九月那批種進去（只會發生一次）
    if(!Object.keys(posts).length) seed();
    push();
  }
  if(tv < TYPES_VERSION || cv < CONTENT_VERSION){
    _set(_ref(_db, `${ROOM}/meta`),
      { typesVersion: TYPES_VERSION, contentVersion: CONTENT_VERSION }).catch(e => console.warn(e));
  }
  saveLocal(); renderAll();

  onValue(ref(_db, `${ROOM}/posts`), s => {
    const v = s.exists() ? s.val() : {};
    if(JSON.stringify(v) === JSON.stringify(posts)) return;
    posts = v; saveLocal(); renderAll();
  });
  return true;
}

function seed(){
  SEED.forEach(s => {
    posts[uid()] = {
      date:s.d, type:s.t, title:s.ti, goal:s.g, ig:s.ig, fb:s.fb || '',
      done: !!s.done, code: s.code || ''   // 八月那幾篇已經發過了，也有素材編號
    };
  });
}

/* ---------- 啟動 ---------- */
loadLocal();
renderAll();

$('#gateBtn').onclick = async () => {
  $('#gateErr').textContent = '';
  try{
    await initFirebase(true);
    $('#gate').style.display = 'none';
  }catch(e){
    $('#gateErr').textContent = e.message || '登入失敗，再試一次';
    setSync('err', e.message);
  }
};

(async () => {
  try{
    const ok = await initFirebase(false);   // 已經登入過就直接進去
    if(ok) $('#gate').style.display = 'none';
    else setSync('wait');
  }catch(e){ setSync('err', e.message); }
})();
</script>
