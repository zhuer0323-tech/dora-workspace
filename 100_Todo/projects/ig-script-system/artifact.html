<title>Connie 卡妮說｜IG 腳本靈感與提示詞產出系統</title>
<style>
  :root{
    --primary:#E37B1B;      /* 主色：禾言 logo 暖橘 */
    --primary-d:#C25A0C;    /* 深橘紅 */
    --primary-l:#FBE2C4;    /* 淺金 */
    --primary-bg:#FEF6EC;   /* 米白底 */
    --accent:#E2461A;       /* 紅橘點綴（logo 火焰紅） */
    --ink:#2A2320;
    --muted:#8A7B6C;
    --line:#EFE6DA;
    --card:#FFFFFF;
    --bg:#FBF8F3;
    --tag-a:#E2461A;
    --shadow:0 2px 12px rgba(227,123,27,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  /* Header */
  header{
    background:linear-gradient(120deg,#F5A623 0%,#E37B1B 45%,#D9531A 100%);
    color:#fff;padding:22px 20px 18px;
  }
  header .wrap{max-width:1080px;margin:0 auto}
  header h1{font-size:20px;font-weight:800;letter-spacing:.5px}
  header p{font-size:13px;opacity:.9;margin-top:4px}
  /* Tabs */
  nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.03)}
  nav .wrap{max-width:1080px;margin:0 auto;display:flex;overflow-x:auto}
  nav button{
    flex:0 0 auto;background:none;border:none;padding:14px 18px;font-size:14px;font-weight:600;
    color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit;
  }
  nav button.active{color:var(--primary);border-bottom-color:var(--primary)}
  nav button:hover{color:var(--primary-d)}
  main{max-width:1080px;margin:0 auto;padding:22px 20px 60px}
  .page{display:none;animation:fade .25s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h2.sec{font-size:17px;font-weight:800;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  /* Series chips */
  .series-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:8px}
  .series-card{
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;
    transition:.15s;box-shadow:var(--shadow)
  }
  .series-card:hover{border-color:var(--primary);transform:translateY(-2px)}
  .series-card.on{border-color:var(--primary);background:var(--primary-bg)}
  .series-card .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:6px}
  .badge.custom{background:var(--primary-l);color:var(--primary-d)}
  .badge.general{background:#F0EEE9;color:#8a7f6a}
  .series-card h3{font-size:15px;font-weight:800}
  .series-card p{font-size:12px;color:var(--muted);margin-top:3px}
  .group-label{font-size:13px;font-weight:800;color:var(--muted);margin:16px 0 8px;letter-spacing:.5px}
  /* direction cards */
  .dir-head{display:flex;align-items:center;gap:10px;margin:22px 0 12px;flex-wrap:wrap}
  .dir-head h3{font-size:16px;font-weight:800}
  .dir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
  .dir-card{
    background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s
  }
  .dir-card:hover{border-color:var(--primary);box-shadow:var(--shadow)}
  .dir-card.on{border-color:var(--primary);background:var(--primary-bg)}
  .dir-card .tag{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-bottom:6px}
  .dir-card .num{float:right;color:#c7d2d0;font-size:12px;font-weight:700}
  .dir-card p{font-size:13px;color:var(--ink);line-height:1.5}
  /* forms */
  .field{margin-bottom:18px}
  .field>label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
  .field .hint{font-weight:500;color:var(--muted);font-size:12px}
  select,input[type=text],input[type=number],textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;
    background:#fff;color:var(--ink)
  }
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--primary)}
  textarea{resize:vertical;min-height:70px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.row2{grid-template-columns:1fr}}
  .inline{display:flex;gap:8px;align-items:center}
  .inline select{flex:1}
  /* structure & style tags */
  .tagpick{display:flex;flex-wrap:wrap;gap:8px}
  .tagpick .t{
    border:1.5px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12.5px;cursor:pointer;background:#fff;transition:.12s;
    user-select:none
  }
  .tagpick .t small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:1px}
  .tagpick .t:hover{border-color:var(--primary)}
  .tagpick .t.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .tagpick .t.on small{color:rgba(255,255,255,.85)}
  .tagpick.style .t.on{background:var(--accent);border-color:var(--accent)}
  /* buttons */
  .btn{
    background:var(--primary);color:#fff;border:none;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.15s
  }
  .btn:hover{background:var(--primary-d)}
  .btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
  .btn.ghost:hover{background:var(--primary-bg)}
  .btn.sm{padding:7px 13px;font-size:12.5px}
  .btn.accent{background:var(--accent)}
  .btn.accent:hover{background:#cf7130}
  .btn.gray{background:#eef1f0;color:var(--muted)}
  .btnbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  /* prompt output */
  .prompt-box{
    background:#12201F;color:#D7E4E2;border-radius:14px;padding:18px;margin-top:16px;font-size:13px;line-height:1.75;
    white-space:pre-wrap;word-break:break-word;font-family:"SF Mono",Menlo,monospace;max-height:520px;overflow:auto;display:none
  }
  .prompt-box.show{display:block}
  /* topic library / list */
  .filterbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .filterbar select,.filterbar input{width:auto;flex:1;min-width:160px}
  .qlist{display:flex;flex-direction:column;gap:8px}
  .qitem{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center
  }
  .qitem .meta{font-size:11px;color:var(--muted);margin-bottom:2px}
  .qitem p{font-size:13.5px}
  .qitem .r{display:flex;gap:6px;flex:0 0 auto}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px}
  /* records */
  .recnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .recnav a{font-size:12.5px;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;color:var(--primary-d);font-weight:700;text-decoration:none}
  .recnav a:hover{border-color:var(--primary);background:var(--primary-bg)}
  .recgroup{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .recgroup>.gh{padding:13px 16px;background:var(--primary-bg);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .recgroup>.gh h3{font-size:15px;font-weight:800;color:var(--primary-d)}
  .recgroup>.gh .cnt{font-size:12px;color:var(--muted);font-weight:700}
  .recgroup .body{padding:6px 16px 14px}
  .recgroup.collapsed .body{display:none}
  .recitem{border-bottom:1px dashed var(--line);padding:12px 0}
  .recitem:last-child{border-bottom:none}
  .recitem .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .recitem h4{font-size:14.5px;font-weight:700}
  .recitem .date{font-size:11px;color:var(--muted);flex:0 0 auto}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}
  .chip.type{background:var(--primary-l);color:var(--primary-d)}
  .chip.style{background:#FBE7D5;color:#b5651d}
  .chip.struct{background:#E4E9F5;color:#4a5b8a}
  .chip.day{background:#EDEDED;color:#666}
  .chip.saved{background:#DFF2E4;color:#2e7d4f}
  .recitem .acts{margin-top:8px;display:flex;gap:8px}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(18,32,31,.5);display:none;z-index:50;align-items:center;justify-content:center;padding:16px}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
  .modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal .mh h3{font-size:16px;font-weight:800}
  .modal .mh .x{cursor:pointer;font-size:22px;color:var(--muted);line-height:1;background:none;border:none}
  .modal .mb{padding:16px 18px;overflow:auto}
  .modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .scripttext{white-space:pre-wrap;font-size:14px;line-height:1.75;background:var(--bg);padding:14px;border-radius:10px}
  .searchresult{display:flex;flex-direction:column;gap:7px;margin-top:12px}
  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:11px 20px;border-radius:30px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hidden{display:none!important}
  .notice{background:var(--primary-bg);border:1px solid var(--primary-l);border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--primary-d);margin-bottom:14px}
  .pill-recommend{font-size:11px;color:var(--accent);font-weight:700;margin-left:6px}
</style>
<header>
  <div class="wrap">
    <h1>Connie 卡妮說 ｜ IG 腳本靈感與提示詞產出系統</h1>
    <p>100+ 品牌廣告操盤經驗，陪企業主少走冤枉路 ｜ 選題 → 設定 → 一鍵產出提示詞</p>
  </div>
</header>

<nav>
  <div class="wrap">
    <button class="tab active" data-tab="ideas">① 靈感選題</button>
    <button class="tab" data-tab="setup">② 腳本設定</button>
    <button class="tab" data-tab="library">③ 題目庫</button>
    <button class="tab" data-tab="custom">④ 自訂題目</button>
    <button class="tab" data-tab="records">⑤ 產出紀錄</button>
  </div>
</nav>

<main>
  <!-- ① 靈感選題 -->
  <section class="page active" id="page-ideas">
    <h2 class="sec">靈感選題</h2>
    <p class="sub">先選一個內容系列，再挑一個創作方向，就能帶著方向去設定腳本。</p>
    <div id="seriesPicker"></div>
    <div id="directionArea"></div>
  </section>

  <!-- ② 腳本設定 -->
  <section class="page" id="page-setup">
    <h2 class="sec">腳本設定</h2>
    <p class="sub">設定好之後按「複製提示詞」，把提示詞貼進 AI 就能產出腳本。</p>

    <div class="field">
      <label>系列選擇</label>
      <select id="s_series"></select>
    </div>

    <div class="field">
      <label>主題 <span class="hint">（先從推薦題目挑，或自己輸入，也可從題目庫搜尋）</span></label>
      <div class="inline" style="margin-bottom:8px">
        <select id="s_topicPick"><option value="">— 請先在「靈感選題」選方向，或直接自行輸入 —</option></select>
        <button class="btn ghost sm" id="btnLib" type="button">從題目庫選題</button>
      </div>
      <input type="text" id="s_topic" placeholder="在這裡輸入 / 修改你的主題">
    </div>

    <div class="row2">
      <div class="field">
        <label>腳本長度</label>
        <select id="s_length"></select>
      </div>
      <div class="field">
        <label>這是第幾天的內容 <span class="hint">（自填天數）</span></label>
        <input type="number" id="s_days" min="1" placeholder="例如 12">
      </div>
    </div>

    <div class="field" id="prField">
      <label>業配商品名稱</label>
      <input type="text" id="s_product" placeholder="業配系列才需要填">
    </div>

    <div class="field">
      <label>腳本結構 <span class="hint">（選一種）</span></label>
      <div class="tagpick" id="s_structure"></div>
    </div>

    <div class="field">
      <label>腳本風格 <span class="hint">（可複選）</span></label>
      <div class="tagpick style" id="s_style"></div>
    </div>

    <div class="field">
      <label>補充細節 / 金句方向 <span class="hint">（選填）</span></label>
      <textarea id="s_detail" placeholder="想強調的重點、想放的金句、想避開的方向…"></textarea>
    </div>

    <div class="field">
      <label>貼入腳本內容 <span class="hint">（選填，把 AI 產出的腳本貼回來存進紀錄）</span></label>
      <textarea id="s_script" placeholder="AI 產好後把完整腳本貼在這裡，儲存後可在「產出紀錄」查看"></textarea>
    </div>

    <div class="btnbar">
      <button class="btn" id="btnPrompt" type="button">複製提示詞</button>
      <button class="btn accent" id="btnSave" type="button">儲存這筆紀錄</button>
      <button class="btn gray sm" id="btnClear" type="button">清空表單</button>
    </div>

    <div class="prompt-box" id="promptBox"></div>
  </section>

  <!-- ③ 題目庫 -->
  <section class="page" id="page-library">
    <h2 class="sec">題目庫</h2>
    <p class="sub">全系列題目都在這裡，可依系列篩選、關鍵字搜尋，點「用這題」直接帶入設定。</p>
    <div class="filterbar">
      <select id="lib_series"><option value="">全部系列</option></select>
      <input type="text" id="lib_search" placeholder="搜尋關鍵字…">
    </div>
    <div class="qlist" id="libList"></div>
  </section>

  <!-- ④ 自訂題目 -->
  <section class="page" id="page-custom">
    <h2 class="sec">自訂題目</h2>
    <p class="sub">自己新增的題目會存在瀏覽器，並出現在題目庫與推薦下拉選單裡。</p>
    <div class="row2">
      <div class="field">
        <label>選擇系列</label>
        <select id="cu_series"></select>
      </div>
      <div class="field">
        <label>題目內容</label>
        <input type="text" id="cu_topic" placeholder="輸入你的題目，Enter 或按新增">
      </div>
    </div>
    <button class="btn" id="btnAddCustom" type="button">新增題目</button>
    <div style="margin-top:22px">
      <h3 style="font-size:14px;font-weight:800;margin-bottom:10px">我的自訂題目</h3>
      <div class="qlist" id="customList"></div>
    </div>
  </section>

  <!-- ⑤ 產出紀錄 -->
  <section class="page" id="page-records">
    <h2 class="sec">產出紀錄</h2>
    <p class="sub">依系列分類保存，點系列可收合，有貼腳本的紀錄可以查看全文。</p>
    <div class="recnav" id="recNav"></div>
    <div id="recArea"></div>
  </section>
</main>

<!-- 題目庫彈窗（設定頁用） -->
<div class="modal" id="libModal">
  <div class="box">
    <div class="mh"><h3>從題目庫選題</h3><button class="x" data-close="libModal">&times;</button></div>
    <div class="mb">
      <div class="filterbar">
        <select id="mod_series"><option value="">全部系列</option></select>
        <input type="text" id="mod_search" placeholder="搜尋關鍵字…">
      </div>
      <div class="searchresult" id="modList"></div>
    </div>
  </div>
</div>

<!-- 查看腳本彈窗 -->
<div class="modal" id="scriptModal">
  <div class="box">
    <div class="mh"><h3 id="sm_title">腳本內容</h3><button class="x" data-close="scriptModal">&times;</button></div>
    <div class="mb"><div class="scripttext" id="sm_body"></div></div>
    <div class="mf"><button class="btn ghost sm" id="sm_copy" type="button">複製腳本</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<textarea id="copyHelper" style="position:fixed;left:-9999px;top:0"></textarea>

<script>
/* ============ 創作者設定 ============ */
const CREATOR = {
  name:"Connie卡妮說｜廣告顧問陪跑｜行銷．電商．商業思維｜陳姿吟",
  memory:"Connie卡妮說，帶你在行銷路上少走彎路",
  fixedStyle:"用白話講行銷，不賣術語。\n分享真實客戶案例，而不是紙上談兵。\n不只教投廣告，更分享品牌經營與商業思維。\n偶爾分享創業、管理、BNI、合作與人生體悟。\n理性分析，但保有溫度。"
};

/* ============ 腳本長度 ============ */
const LENGTHS = [
  "30 秒（約 150 字）","45 秒（約 220 字）","60 秒（約 500 字）",
  "90 秒（約 750 字）","2 分鐘（約 1000 字）","3 分鐘（約 1500 字）"
];

/* ============ 腳本結構（20+） ============ */
const STRUCTURES = [
  ["故事型","用一個完整的故事帶出觀點"],
  ["吐槽型","用抱怨或吐槽引起共鳴"],
  ["建議型","直接給出可執行的建議"],
  ["懺悔型","坦白自己的錯誤或失敗"],
  ["揭秘型","揭露不為人知的內幕"],
  ["翻轉型","先建立認知再推翻它"],
  ["對比型","用兩種情況做強烈對照"],
  ["問答型","用一問一答推進內容"],
  ["列清單型","把重點整理成條列"],
  ["信件型","用寫信的口吻對某人說話"],
  ["陪伴型","像朋友一樣陪你聊"],
  ["宣言型","堅定地表達一個立場"],
  ["生活喜劇型","用幽默日常博君一笑"],
  ["決策型","帶你走過一個做決定的過程"],
  ["複盤型","事後回顧一件事的得與失"],
  ["觀察報告型","客觀描述你觀察到的現象"],
  ["教學型","一步步教會你一件事"],
  ["時間軸型","依時間順序講一段經歷"],
  ["思考題型","拋出一個問題讓觀眾思考"],
  ["隨筆心情型","記錄當下的心情與感受"]
];

/* ============ 腳本風格 ============ */
const STYLES = ["幽默自嘲","溫暖共鳴","輕鬆日常","適合分享","引發討論","強開場懸念","深度反思","知識輸出","療癒陪伴"];

/* ============ 系列資料 ============ */
/* 每個系列：id / name / category(custom|general) / desc / strategy / directions[20]{tag,desc,q[5]} */
const SERIES = [
{
  id:"ad-diary", name:"廣告陪跑日記", category:"custom",
  desc:"分享每天實際遇到的客戶問題",
  strategy:"用每天真實的客戶現場，建立「她真的在第一線」的專業信任感，讓觀眾覺得你懂實戰、值得託付。",
  directions:[
    {tag:"ROAS下滑",desc:"廣告成效突然變差，一起找出真正的原因",q:[
      "客戶一早打來說 ROAS 崩了，我點開後台那一刻手心在冒汗",
      "ROAS 下滑不一定是廣告的錯，那天我查到第三層才發現真相",
      "同一組廣告昨天還好好的，今天突然沒人買，我先做了這件事",

/* ============ 狀態與儲存 ============ */
const LS_REC="cks_records", LS_CUS="cks_customTopics", LS_DRAFT="cks_setupDraft";
let records = load(LS_REC, []);
let customTopics = load(LS_CUS, {}); // {seriesId:[{id,topic}]}
let state = { series:null, direction:null };

function load(k,def){ try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def} }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function seriesById(id){ return SERIES.find(s=>s.id===id); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ============ 複製（相容本地檔案） ============ */
function copyText(text){
  const h=document.getElementById("copyHelper");
  h.value=text; h.focus(); h.select();
  try{ document.execCommand("copy"); toast("已複製到剪貼簿"); }
  catch(e){ toast("複製失敗，請手動選取"); }
  window.getSelection().removeAllRanges();
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800);
}

document.querySelectorAll("nav .tab").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("nav .tab").forEach(x=>x.classList.remove("active"));

function goTab(tab){
  document.querySelector('nav .tab[data-tab="'+tab+'"]').click();
}

/* ============ ① 靈感選題 ============ */
function renderSeriesPicker(){
  const custom=SERIES.filter(s=>s.category==="custom");
  const general=SERIES.filter(s=>s.category==="general");
  let html="";
  html+=`<div class="group-label">專屬系列</div><div class="series-grid">`;
  custom.forEach(s=>html+=seriesCardHTML(s));
  html+=`</div>`;
  if(general.length){
    html+=`<div class="group-label">通用系列</div><div class="series-grid">`;
    general.forEach(s=>html+=seriesCardHTML(s));
    html+=`</div>`;
  }
  document.getElementById("seriesPicker").innerHTML=html;
  document.querySelectorAll("#seriesPicker .series-card").forEach(c=>{
    c.addEventListener("click",()=>selectSeries(c.dataset.id));
  });
}
function seriesCardHTML(s){
  const on = state.series===s.id ? "on":"";
  const badge = s.category==="custom"?`<span class="badge custom">專屬</span>`:`<span class="badge general">通用</span>`;
  return `<div class="series-card ${on}" data-id="${s.id}">${badge}<h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p></div>`;
}
function selectSeries(id){
  state.series=id; state.direction=null;
  renderSeriesPicker(); renderDirections();
}
function renderDirections(){
  const area=document.getElementById("directionArea");
  if(!state.series){ area.innerHTML=""; return; }
  const s=seriesById(state.series);
  let html=`<div class="dir-head"><h3>${esc(s.name)} · 20 個創作方向</h3><span class="sub" style="margin:0">${esc(s.strategy)}</span></div><div class="dir-grid">`;
  s.directions.forEach((d,i)=>{
    const on = state.direction===i ? "on":"";
    html+=`<div class="dir-card ${on}" data-i="${i}"><span class="num">${String(i+1).padStart(2,"0")}</span><span class="tag">${esc(d.tag)}</span><p>${esc(d.desc)}</p></div>`;
  });
  html+=`</div>`;
  if(state.direction!==null){
    html+=`<div class="btnbar" style="margin-top:16px"><button class="btn" id="btnToSetup" type="button">用這個方向去設定腳本 →</button></div>`;
  }
  area.innerHTML=html;
  area.querySelectorAll(".dir-card").forEach(c=>{
    c.addEventListener("click",()=>{ state.direction=+c.dataset.i; renderDirections(); });
  });
  const bt=document.getElementById("btnToSetup");
  if(bt) bt.addEventListener("click",()=>{
    applySelectionToSetup(); goTab("setup");
  });
}

/* ============ ② 腳本設定 ============ */
function initSetupStatic(){
  // 系列下拉（設定頁 / 自訂頁）
  const opt = SERIES.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
  document.getElementById("s_series").innerHTML=opt;
  document.getElementById("cu_series").innerHTML=opt;
  // 長度
  document.getElementById("s_length").innerHTML=LENGTHS.map((l,i)=>`<option value="${i}">${l}</option>`).join("");
  // 結構
  document.getElementById("s_structure").innerHTML=STRUCTURES.map((st,i)=>
    `<div class="t" data-i="${i}" title="${esc(st[1])}">${st[0]}<small>${esc(st[1])}</small></div>`).join("");
  document.querySelectorAll("#s_structure .t").forEach(t=>{
    t.addEventListener("click",()=>{
      document.querySelectorAll("#s_structure .t").forEach(x=>x.classList.remove("on"));
      t.classList.add("on"); saveDraft();
    });
  });
  // 風格（複選）
  document.getElementById("s_style").innerHTML=STYLES.map((st,i)=>`<div class="t" data-i="${i}">${st}</div>`).join("");
  document.querySelectorAll("#s_style .t").forEach(t=>{
    t.addEventListener("click",()=>{ t.classList.toggle("on"); saveDraft(); });
  });
  // 系列改變 → 更新推薦下拉 & 業配欄位
  document.getElementById("s_series").addEventListener("change",()=>{
    state.series=document.getElementById("s_series").value;
    rebuildTopicPick(); togglePR(); saveDraft();
  });
  // 推薦下拉
  document.getElementById("s_topicPick").addEventListener("change",onTopicPick);
  // 從題目庫選題
  document.getElementById("btnLib").addEventListener("click",openLibModal);
  // 按鈕
  document.getElementById("btnPrompt").addEventListener("click",buildPrompt);
  document.getElementById("btnSave").addEventListener("click",saveRecord);
  document.getElementById("btnClear").addEventListener("click",clearSetup);
  // 表單變動存草稿
  ["s_topic","s_days","s_product","s_detail","s_script","s_length"].forEach(id=>{
    document.getElementById(id).addEventListener("input",saveDraft);
    document.getElementById(id).addEventListener("change",saveDraft);
  });
}
function togglePR(){
  const s=seriesById(document.getElementById("s_series").value);
  const show = s && (s.id==="sponsor" || s.name.includes("業配"));
  document.getElementById("prField").classList.toggle("hidden",!show);
}
function rebuildTopicPick(){
  const sel=document.getElementById("s_topicPick");
  const sid=document.getElementById("s_series").value;
  const s=seriesById(sid);
  let opts=`<option value="">— 選擇推薦題目 —</option>`;
  // 若有選方向 → 該方向 5 題；否則列出全系列前幾題方向的題目做參考
  if(s){
    if(state.direction!==null && s.directions[state.direction]){
      const d=s.directions[state.direction];
      opts+=`<optgroup label="方向：${esc(d.tag)}">`+
        d.q.map(q=>`<option value="${esc(q)}">${esc(q)}</option>`).join("")+`</optgroup>`;
    }
    // 自訂題目
    const cus=(customTopics[sid]||[]);
    if(cus.length){
      opts+=`<optgroup label="我的自訂題目">`+
        cus.map(c=>`<option value="${esc(c.topic)}">${esc(c.topic)}</option>`).join("")+`</optgroup>`;
    }
  }
  opts+=`<option value="__self__">＋ 以上都不要，我自己輸入</option>`;
  sel.innerHTML=opts;
}
function onTopicPick(){
  const sel=document.getElementById("s_topicPick");
  const v=sel.value;
  if(v==="__self__"){
    const inp=document.getElementById("s_topic");
    inp.value=""; inp.focus(); sel.value="";
  }else if(v){
    document.getElementById("s_topic").value=v;
  }
  saveDraft();
}
function applySelectionToSetup(){
  if(state.series){
    document.getElementById("s_series").value=state.series;
    togglePR();
  }
  rebuildTopicPick();
  // 自動帶第一個推薦題（可再改）
  if(state.series && state.direction!==null){
    const d=seriesById(state.series).directions[state.direction];
    if(d && d.q[0]) document.getElementById("s_topic").value=d.q[0];
  }
  saveDraft();
}
function getStructure(){
  const el=document.querySelector("#s_structure .t.on");
  return el?STRUCTURES[+el.dataset.i]:null;
}
function getStyles(){
  return [...document.querySelectorAll("#s_style .t.on")].map(el=>STYLES[+el.dataset.i]);
}
function collectSetup(){
  const sid=document.getElementById("s_series").value;
  const s=seriesById(sid);
  const st=getStructure();
  return {
    seriesId:sid, seriesName:s?s.name:"", strategy:s?s.strategy:"",
    topic:document.getElementById("s_topic").value.trim(),
    lengthIdx:+document.getElementById("s_length").value,
    length:LENGTHS[+document.getElementById("s_length").value],
    structure:st, styles:getStyles(),
    days:document.getElementById("s_days").value.trim(),
    product:document.getElementById("s_product").value.trim(),
    detail:document.getElementById("s_detail").value.trim(),
    script:document.getElementById("s_script").value.trim()
  };
}
function buildPrompt(){
  const d=collectSetup();
  if(!d.topic){ toast("請先填主題"); document.getElementById("s_topic").focus(); return; }
  if(!d.structure){ toast("請選一個腳本結構"); return; }
  const box=document.getElementById("promptBox");
  const text=composePrompt(d);
  box.textContent=text; box.classList.add("show");
  copyText(text);
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function composePrompt(d){
  const structLine = d.structure ? `${d.structure[0]}（${d.structure[1]}）` : "";
  const styleLine = d.styles.length ? d.styles.join(" / ") : "自然真實";
  const prod = (d.seriesName.includes("業配") && d.product) ? `\n🛍 業配商品：${d.product}` : "";
  const detail = d.detail ? `\n💡 補充細節或金句方向：${d.detail}` : "";
  const days = d.days ? d.days : "1";
  return `你是台灣 IG 創作者「${CREATOR.name}」的腳本助理。

請幫我寫一篇「${d.seriesName}」系列的 IG 口播腳本。

📌 主題：${d.topic}
📈 長度：${d.length}
🗂 結構：${structLine}
📅 這是第 ${days} 天的內容${prod}
🎯 內容類型：${d.seriesName}
   （策略說明：${d.strategy}）
✨ 腳本風格：${styleLine}${detail}

【固定風格要求】
- 口語自然，有節奏感，善用短句斷行
- 第一人稱，帶有真實感和情緒
- 不要說教，用「說故事」或「分享感受」帶出觀點
- 內容風格：${CREATOR.fixedStyle}

【結尾規則（每篇必須執行）】
每篇腳本結尾必須包含以下兩個部分：
① 身份記憶句：「${CREATOR.memory}」
② 互動 CTA 句（請根據本篇內容的情緒基調自行決定語氣）：
   - 嚴肅／沉重內容 → 語氣真誠帶連結感，例：「如果你也有過類似的感受，可以留言告訴我，你不孤單」
   - 中性／分享型內容 → 語氣自然邀請，例：「你有沒有類似的經驗？留言跟我說吧」
   - 輕鬆／幽默內容 → 語氣輕鬆有趣，例：「你也有這種經歷嗎？快來留言，讓我知道我不是唯一一個」
   - 知識／建議型內容 → 語氣引導行動，例：「這幾點你覺得哪個最有感？留言告訴我你的想法」
   - 旅遊／美食推薦內容 → 語氣輕鬆帶好奇，例：「你去過這裡嗎？有私藏推薦也歡迎留言分享」

【標題視角規則（每篇必須執行）】
請在腳本最上方先產出：
標題：（讓人想點進來看的標題）
副標：（一句話帶出情緒或懸念的副標）

腳本正文輸出後，請直接輸出可以唸的內容，不要加任何說明或備註。

---

【拍攝建議】
請根據上面的腳本內容和風格，另外產出一段拍攝建議，和腳本分開呈現，包含：
1. 影片形式：口播直拍 / 加入生活畫面 B-roll / 短劇形式，擇一或組合建議
2. 拍攝地點：具體建議適合的拍攝場景
3. 拍攝畫面：建議穿插的補充畫面或動作
4. 送分建議：讓這支影片在第一秒被留住的具體操作建議`;
}
function saveRecord(){
  const d=collectSetup();
  if(!d.topic){ toast("請先填主題再儲存"); return; }
  if(!d.structure){ toast("請選一個腳本結構"); return; }
  records.unshift({
    id:uid(), seriesId:d.seriesId, seriesName:d.seriesName,
    topic:d.topic, length:d.length, days:d.days, product:d.product,
    structure:d.structure?d.structure[0]:"", styles:d.styles,
    detail:d.detail, script:d.script,
    date:new Date().toISOString()
  });
  save(LS_REC,records);
  toast("已儲存到產出紀錄");
  renderRecords();
}
function clearSetup(){
  ["s_topic","s_days","s_product","s_detail","s_script"].forEach(id=>document.getElementById(id).value="");
  document.querySelectorAll("#s_structure .t,#s_style .t").forEach(t=>t.classList.remove("on"));
  document.getElementById("promptBox").classList.remove("show");
  document.getElementById("s_topicPick").value="";
  saveDraft();
  toast("已清空");
}
/* 草稿：讓設定頁重整後仍在 */
function saveDraft(){
  const d={
    series:document.getElementById("s_series").value,
    topic:document.getElementById("s_topic").value,
    lengthIdx:document.getElementById("s_length").value,
    days:document.getElementById("s_days").value,
    product:document.getElementById("s_product").value,
    detail:document.getElementById("s_detail").value,
    script:document.getElementById("s_script").value,
    structIdx:(document.querySelector("#s_structure .t.on")||{}).dataset?.i ?? "",
    styleIdx:[...document.querySelectorAll("#s_style .t.on")].map(t=>t.dataset.i),
    direction:state.direction
  };
  save(LS_DRAFT,d);
}
function restoreDraft(){
  const d=load(LS_DRAFT,null); if(!d) return;
  if(d.series){ document.getElementById("s_series").value=d.series; state.series=d.series; }
  document.getElementById("s_topic").value=d.topic||"";
  document.getElementById("s_length").value=d.lengthIdx||0;
  document.getElementById("s_days").value=d.days||"";
  document.getElementById("s_product").value=d.product||"";
  document.getElementById("s_detail").value=d.detail||"";
  document.getElementById("s_script").value=d.script||"";
  if(d.structIdx!=="" && d.structIdx!=null){
    const el=document.querySelector(`#s_structure .t[data-i="${d.structIdx}"]`); if(el)el.classList.add("on");
  }
  (d.styleIdx||[]).forEach(i=>{
    const el=document.querySelector(`#s_style .t[data-i="${i}"]`); if(el)el.classList.add("on");
  });
  if(d.direction!=null) state.direction=d.direction;
  togglePR(); rebuildTopicPick();
}

/* ============ ③ 題目庫 ============ */
function allTopics(){
  const list=[];
  SERIES.forEach(s=>{
    s.directions.forEach(d=>{
      d.q.forEach(q=>list.push({seriesId:s.id,seriesName:s.name,tag:d.tag,topic:q,custom:false}));
    });
  });
  Object.keys(customTopics).forEach(sid=>{
    const s=seriesById(sid); if(!s) return;
    (customTopics[sid]||[]).forEach(c=>list.push({seriesId:sid,seriesName:s.name,tag:"自訂",topic:c.topic,custom:true,cid:c.id}));
  });
  return list;
}
function initLibrary(){
  document.getElementById("lib_series").innerHTML=`<option value="">全部系列</option>`+
    SERIES.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
  document.getElementById("mod_series").innerHTML=document.getElementById("lib_series").innerHTML;
  document.getElementById("lib_series").addEventListener("change",renderLibrary);
  document.getElementById("lib_search").addEventListener("input",renderLibrary);
  document.getElementById("mod_series").addEventListener("change",renderModList);
  document.getElementById("mod_search").addEventListener("input",renderModList);
  renderLibrary();
}
function filterTopics(sid,kw){
  kw=(kw||"").trim().toLowerCase();
  return allTopics().filter(t=>{
    if(sid && t.seriesId!==sid) return false;
    if(kw && !(t.topic.toLowerCase().includes(kw)||t.tag.toLowerCase().includes(kw)||t.seriesName.toLowerCase().includes(kw))) return false;
    return true;
  });
}
function renderLibrary(){
  const sid=document.getElementById("lib_series").value;
  const kw=document.getElementById("lib_search").value;
  const list=filterTopics(sid,kw);
  const box=document.getElementById("libList");
  if(!list.length){ box.innerHTML=`<div class="empty">找不到符合的題目</div>`; return; }
  box.innerHTML=list.slice(0,300).map(t=>`
    <div class="qitem">
      <div><div class="meta">${esc(t.seriesName)} · ${esc(t.tag)}${t.custom?" · 自訂":""}</div><p>${esc(t.topic)}</p></div>
      <div class="r"><button class="btn ghost sm" data-topic="${esc(t.topic)}" data-sid="${t.seriesId}">用這題 →</button></div>
    </div>`).join("");
  box.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click",()=>useTopic(b.dataset.sid,b.dataset.topic));
  });
}
function useTopic(sid,topic){
  document.getElementById("s_series").value=sid; state.series=sid;
  togglePR(); rebuildTopicPick();
  document.getElementById("s_topic").value=topic;
  saveDraft(); goTab("setup"); toast("已帶入設定頁");
}

/* 題目庫彈窗 */
function openLibModal(){
  document.getElementById("mod_series").value=document.getElementById("s_series").value||"";
  document.getElementById("mod_search").value="";
  renderModList();
  openModal("libModal");
}
function renderModList(){
  const sid=document.getElementById("mod_series").value;
  const kw=document.getElementById("mod_search").value;
  const list=filterTopics(sid,kw);
  const box=document.getElementById("modList");
  if(!list.length){ box.innerHTML=`<div class="empty">找不到符合的題目</div>`; return; }
  box.innerHTML=list.slice(0,200).map(t=>`
    <div class="qitem">
      <div><div class="meta">${esc(t.seriesName)} · ${esc(t.tag)}</div><p>${esc(t.topic)}</p></div>
      <div class="r"><button class="btn sm" data-topic="${esc(t.topic)}" data-sid="${t.seriesId}">選這題</button></div>
    </div>`).join("");
  box.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click",()=>{
      document.getElementById("s_series").value=b.dataset.sid; state.series=b.dataset.sid;
      togglePR(); rebuildTopicPick();
      document.getElementById("s_topic").value=b.dataset.topic;
      saveDraft(); closeModal("libModal"); toast("已選入主題");
    });
  });
}

/* ============ ④ 自訂題目 ============ */
function initCustom(){
  document.getElementById("btnAddCustom").addEventListener("click",addCustom);
  document.getElementById("cu_topic").addEventListener("keydown",e=>{ if(e.key==="Enter") addCustom(); });
  renderCustomList();
}
function addCustom(){
  const sid=document.getElementById("cu_series").value;
  const topic=document.getElementById("cu_topic").value.trim();
  if(!topic){ toast("請輸入題目"); return; }
  if(!customTopics[sid]) customTopics[sid]=[];
  customTopics[sid].unshift({id:uid(),topic});
  save(LS_CUS,customTopics);
  document.getElementById("cu_topic").value="";
  renderCustomList(); renderLibrary(); rebuildTopicPick();
  toast("已新增自訂題目");
}
function renderCustomList(){
  const box=document.getElementById("customList");
  const rows=[];
  Object.keys(customTopics).forEach(sid=>{
    const s=seriesById(sid); if(!s) return;
    (customTopics[sid]||[]).forEach(c=>rows.push({sid,name:s.name,...c}));
  });
  if(!rows.length){ box.innerHTML=`<div class="empty">還沒有自訂題目</div>`; return; }
  box.innerHTML=rows.map(r=>`
    <div class="qitem">
      <div><div class="meta">${esc(r.name)}</div><p>${esc(r.topic)}</p></div>
      <div class="r">
        <button class="btn ghost sm" data-sid="${r.sid}" data-topic="${esc(r.topic)}">用這題 →</button>
        <button class="btn gray sm" data-del="${r.id}" data-dsid="${r.sid}">刪除</button>
      </div>
    </div>`).join("");
  box.querySelectorAll("[data-topic]").forEach(b=>b.addEventListener("click",()=>useTopic(b.dataset.sid,b.dataset.topic)));
  box.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    customTopics[b.dataset.dsid]=(customTopics[b.dataset.dsid]||[]).filter(x=>x.id!==b.dataset.del);
    save(LS_CUS,customTopics);
    renderCustomList(); renderLibrary(); rebuildTopicPick();
    toast("已刪除");
  }));
}

/* ============ ⑤ 產出紀錄 ============ */
function initRecords(){
  document.getElementById("sm_copy").addEventListener("click",()=>{
    copyText(document.getElementById("sm_body").textContent);
  });
  renderRecords();
}
function renderRecords(){
  const nav=document.getElementById("recNav");
  const area=document.getElementById("recArea");
  if(!records.length){
    nav.innerHTML=""; area.innerHTML=`<div class="empty">還沒有任何紀錄，去「腳本設定」產出並儲存吧</div>`; return;
  }
  // group by series，保持 SERIES 順序
  const groups={};
  records.forEach(r=>{ (groups[r.seriesId]=groups[r.seriesId]||[]).push(r); });
  const order=SERIES.map(s=>s.id).filter(id=>groups[id]);
  Object.keys(groups).forEach(id=>{ if(!order.includes(id)) order.push(id); });

  nav.innerHTML=order.map(id=>{
    const name=(seriesById(id)||{}).name||groups[id][0].seriesName;
    return `<a data-jump="rec-${id}">${esc(name)} (${groups[id].length})</a>`;
  }).join("");

  area.innerHTML=order.map(id=>{
    const name=(seriesById(id)||{}).name||groups[id][0].seriesName;
    const items=groups[id].map(r=>recItemHTML(r)).join("");
    return `<div class="recgroup" id="rec-${id}">
      <div class="gh"><h3>${esc(name)}</h3><span class="cnt">${groups[id].length} 篇 ▾</span></div>
      <div class="body">${items}</div>
    </div>`;
  }).join("");

  nav.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{
    const el=document.getElementById(a.dataset.jump);
    el.classList.remove("collapsed");
    el.scrollIntoView({behavior:"smooth",block:"start"});
  }));
  area.querySelectorAll(".gh").forEach(h=>h.addEventListener("click",()=>{
    h.parentElement.classList.toggle("collapsed");
  }));
  area.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{
    const r=records.find(x=>x.id===b.dataset.view);
    document.getElementById("sm_title").textContent=r.topic;
    document.getElementById("sm_body").textContent=r.script;
    openModal("scriptModal");
  }));
  area.querySelectorAll("[data-prompt]").forEach(b=>b.addEventListener("click",()=>{
    const r=records.find(x=>x.id===b.dataset.prompt);
    reProduce(r);
  }));
  area.querySelectorAll("[data-delrec]").forEach(b=>b.addEventListener("click",()=>{
    records=records.filter(x=>x.id!==b.dataset.delrec);
    save(LS_REC,records); renderRecords(); toast("已刪除紀錄");
  }));
}
function recItemHTML(r){
  const dt=new Date(r.date);
  const dateStr=`${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,"0")}/${String(dt.getDate()).padStart(2,"0")}`;
  const styleChips=(r.styles||[]).map(s=>`<span class="chip style">${esc(s)}</span>`).join("");
  const saved=r.script?`<span class="chip saved">已存腳本</span>`:"";
  const viewBtn=r.script?`<button class="btn ghost sm" data-view="${r.id}">查看腳本</button>`:"";
  return `<div class="recitem">
    <div class="top"><h4>${esc(r.topic)}</h4><span class="date">${dateStr}</span></div>
    <div class="chips">
      <span class="chip type">${esc(r.seriesName)}</span>
      ${r.structure?`<span class="chip struct">${esc(r.structure)}</span>`:""}
      ${styleChips}
      ${r.days?`<span class="chip day">第 ${esc(r.days)} 天</span>`:""}
      ${saved}
    </div>
    <div class="acts">
      ${viewBtn}
      <button class="btn ghost sm" data-prompt="${r.id}">再產一次提示詞</button>
      <button class="btn gray sm" data-delrec="${r.id}">刪除</button>
    </div>
  </div>`;
}
function reProduce(r){
  const s=seriesById(r.seriesId)||{};
  const st=STRUCTURES.find(x=>x[0]===r.structure)||null;
  const d={seriesName:r.seriesName,strategy:s.strategy||"",topic:r.topic,length:r.length,
    structure:st,styles:r.styles||[],days:r.days,product:r.product,detail:r.detail};
  const text=composePrompt(d);
  copyText(text);
}

/* ============ Modal ============ */
function openModal(id){ document.getElementById(id).classList.add("show"); }
function closeModal(id){ document.getElementById(id).classList.remove("show"); }
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>closeModal(b.dataset.close)));
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{ if(e.target===m) m.classList.remove("show"); }));

/* ============ 啟動 ============ */
function boot(){
  renderSeriesPicker();
  initSetupStatic();
  initLibrary();
  initCustom();
  initRecords();
  restoreDraft();
  rebuildTopicPick();
  togglePR();
}
boot();
</script>
