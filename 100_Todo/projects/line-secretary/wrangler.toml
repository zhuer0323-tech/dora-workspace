name = "dora-line-secretary"
main = "src/index.js"
compatibility_date = "2026-08-17"
workers_dev = true

# 工作台的雲端位置（不是機密，機密走 wrangler secret）
[vars]
WS_DB_URL = "https://busan-trip-2026-201f8-default-rtdb.asia-southeast1.firebasedatabase.app"
WS_ROOM = "ws_k7m2q9xr4t"
MN_ROOM = "mn_x3f9b6qz"          # 記帳（個人開銷），跟工作台不同節點

# 每天收盤後更新持股價格、定期定額自動記帳（src/stock.js）。
# 時間是 UTC，對應台灣週一到週五 15:30／18:00／21:00；收盤資料什麼時候出來不一定，所以跑三次
[triggers]
crons = ["30 7 * * 1-5", "0 10 * * 1-5", "0 13 * * 1-5"]

# 需要另外設定的機密（wrangler secret put <名稱>）：
#   LINE_CHANNEL_SECRET  驗證訊息真的來自 LINE
#   LINE_ACCESS_TOKEN    回訊息用（跟 8:30 早報同一組）
#   LINE_USER_ID         只聽這個人的話
#   FIREBASE_SA          Firebase 服務帳號金鑰的完整 json 內容
#   MONEY_TOKEN          iPhone 捷徑記帳用的密碼（自己想一串長的，捷徑那邊要填一樣的）
#   META_TOKEN           Meta 廣告帳戶的長期權杖（跟每日日報同一把，會過期要換）
#   ANTHROPIC_API_KEY    廣告回報的分析交給 Claude 寫，這是 API 金鑰
