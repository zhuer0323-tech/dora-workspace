<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Content — Hayen Chat Style</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .card {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    font-family: 'Noto Sans TC', sans-serif;
    background-color: #F3F1EC;
    background-image:
      linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .logo { position: absolute; top: 44px; right: 56px; height: 84px; z-index: 4; }

  .ribbon {
    position: absolute;
    top: 176px;
    left: -16px;
    background: linear-gradient(90deg, #E8622C, #F0862C);
    color: #FFFBF5;
    font-weight: 900;
    font-size: 42px;
    padding: 22px 64px 22px 44px;
    clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%);
    z-index: 3;
    box-shadow: 0 8px 0 rgba(0,0,0,0.08);
  }

  .arc-deco {
    position: absolute;
    left: 40px;
    right: 40px;
    bottom: 60px;
    top: 300px;
    background: #FFC93C;
    border-radius: 24px 24px 500px 500px / 24px 24px 260px 260px;
    z-index: 0;
  }

  .panel {
    position: absolute;
    left: 76px;
    right: 76px;
    top: 300px;
    bottom: 96px;
    background: #FFFBF5;
    border-radius: 8px 8px 460px 460px / 8px 8px 240px 240px;
    z-index: 1;
    padding: 76px 68px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .title {
    font-weight: 900;
    font-size: 68px;
    color: #2B2420;
    text-align: center;
    line-height: 1.4;
    margin-bottom: 48px;
  }

  .checklist {
    display: flex;
    flex-direction: column;
    gap: 24px;
    width: 100%;
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 20px;
    background: #FFC93C;
    border: 4px solid #2B2420;
    border-radius: 20px;
    padding: 24px 32px;
  }
  .check-icon { flex-shrink: 0; }
  .check-text {
    font-weight: 900;
    font-size: 38px;
    color: #2B2420;
    line-height: 1.3;
  }

  .icon-wrap { margin-top: 44px; }

  .footer-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    text-align: center;
    padding: 30px 40px;
    font-weight: 700;
    font-size: 32px;
    color: #2B2420;
    background: #FDEBD8;
    z-index: 2;
  }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="file:///Users/angela/Downloads/S__21823579_0.jpg" alt="禾言數位行銷">
  <div class="ribbon">問題</div>

  <div class="arc-deco"></div>
  <div class="panel">
    <p class="title">憑感覺花預算<br>小心越燒越心慌</p>
    <div class="checklist">
      <div class="check-item">
        <svg class="check-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2B2420" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
        <span class="check-text">憑感覺抓一個數字就下手</span>
      </div>
      <div class="check-item">
        <svg class="check-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2B2420" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
        <span class="check-text">錢燒完，訂單卻沒進來</span>
      </div>
      <div class="check-item">
        <svg class="check-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2B2420" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
        <span class="check-text">開始懷疑廣告根本沒用</span>
      </div>
    </div>
    <div class="icon-wrap">
      <svg width="130" height="130" viewBox="0 0 24 24" fill="none" stroke="#E8622C" stroke-width="1.5">
        <circle cx="12" cy="12" r="9"/>
        <path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.8-2.5 2-2.5 4"/>
        <circle cx="12" cy="16.5" r="0.6" fill="#E8622C"/>
      </svg>
    </div>
  </div>

  <div class="footer-bar">其實不是廣告的問題，是預算邏輯錯了</div>
</div>
</body>
</html>
